// ===== game.js =====
/* Core simulation shared by every mode: actors, weapons, bullets, grenades, explosions, damage, pickups, interactions.
   Modes plug in through zombies.js (ZM.*) and tdm.js (TD.*). Nothing here touches the DOM.
   Visual + sound events go into G.vev (rendered locally and forwarded to an online guest). */

const SOLDIER_R = 13, SOLDIER_SPEED = 172;

/* Weapon definition for a carried slot (merges the Forge upgrade). */
const _upCache = {};
function wdef(slot) {
  const base = WEAPONS[slot.id];
  if (!slot.up || !base.up) return base;
  return _upCache[slot.id] || (_upCache[slot.id] = Object.assign({}, base, base.up, { baseName: base.name, upgraded: true }));
}
function newSlot(id, up = false) { const d = wdef({ id, up }); return { id, up, mag: d.mag, res: d.res }; }

function newMatch(cfg) {
  const def = MAP_DEFS.find((d) => d.id === cfg.mapId) || MAP_DEFS[0];
  const map = parseMap(def);
  initWorld(map, cfg.mode);
  const G = {
    cfg, mode: cfg.mode, map, time: 0, frame: 0, actors: [], nextId: 1, hash: makeHash(map), projs: [], drops: [], powerups: [], zones: [],
    vev: [], humans: [], over: false, overT: 0, winner: null, demo: !!cfg.demo, net: null, msgs: [], seed: cfg.seed || 1,
  };
  if (cfg.mode === "zombies") ZM.init(G); else TD.init(G);
  if (cfg.sameScreen && !cfg.split) G.leash = TD.leash;
  return G;
}

/* ---------------- actors ---------------- */
function makeSoldier(G, o) {
  const op = OPERATORS.find((p) => p.id === o.op) || OPERATORS[0];
  const a = {
    id: G.nextId++, kind: "soldier", team: o.team || 0, human: !!o.human, pidx: o.pidx === undefined ? -1 : o.pidx, remote: !!o.remote, netId: o.netId,
    name: o.name || op.name, op: op.id, x: o.x, y: o.y, vx: 0, vy: 0, r: SOLDIER_R, ang: o.ang || 0, moveAng: 0, walk: 0,
    hp: o.hp || 100, maxHp: o.hp || 100, alive: true, down: false, bleed: 0, hurtT: -99, protectT: 0, respawnT: 0,
    weapons: o.weapons || [newSlot("p9")], cur: 0, fireCD: 0, reloadT: 0, reloadDur: 0, swapT: 0, spreadAdd: 0, firing: false, lastShot: -99,
    frags: o.frags === undefined ? 2 : o.frags, gCD: 0, knifeCD: 0, knifeT: 0, perks: [], points: 0, kills: 0, deaths: 0, assists: 0, streak: 0, bestStreak: 0, crits: 0,
    downs: 0, revives: 0, windUses: 0, prompt: null, holdT: 0, holdKey: null, bot: o.bot || null, recoil: 0, flash: 0, light: true, stats: { shots: 0, hits: 0 },
  };
  G.actors.push(a);
  if (a.human) G.humans.push(a);
  return a;
}
function curSlot(a) { return a.weapons[a.cur] || a.weapons[0]; }
function curDef(a) { return wdef(curSlot(a)); }
function hasPerk(a, p) { return a.perks.includes(p); }
function isEnemy(G, a, b) {
  if (a === b || !b.alive) return false;
  if (G.mode === "zombies") return (a.kind === "zombie") !== (b.kind === "zombie");
  return b.kind === "soldier" && a.team !== b.team;
}
// can `b` be hit by `a`'s attacks right now
function targetable(G, a, b) { return isEnemy(G, a, b) && !(b.kind === "soldier" && b.down) && !(b.protectT > 0) && !(b.rise > 0.6); }

function ev(G, e) { G.vev.push(e); return e; }
function snd(G, s, x, y, v = 1) { G.vev.push({ k: "snd", s, x, y, v }); }

/* ---------------- step ---------------- */
function stepMatch(G, inputs, dt) {
  G.time += dt; G.frame++;
  hashClear(G.hash);
  for (const a of G.actors) if (a.alive) hashAdd(G.hash, a);
  // soldiers (humans + bots)
  for (const a of G.actors) {
    if (a.kind !== "soldier") continue;
    let inp = null;
    if (a.human) inp = a.remote ? a.netInp || {} : inputs[a.pidx] || {};
    else if (a.bot) inp = botThink(G, a, dt);
    stepSoldier(G, a, inp || {}, dt);
  }
  if (G.mode === "zombies") ZM.step(G, dt); else TD.step(G, dt);
  stepProjectiles(G, dt);
  stepDrops(G, dt);
  runSimTimers(G);
  // remove dead zombies after their death frame
  if (G.frame % 30 === 0) G.actors = G.actors.filter((a) => a.alive || a.kind !== "zombie");
}

function moveSpeed(G, a) {
  const d = curDef(a);
  let s = SOLDIER_SPEED * (d.mob || 1);
  if (hasPerk(a, "swift")) s *= 1.15;
  const t = tileOf(G.map, a.x, a.y);
  if (t >= 0 && G.map.floor[t] === F_CORN) s *= 0.78;
  if (a.down) s = 42;
  if (a.reloadT > 0) s *= 0.92;
  if (a.bot && a.bot.slow) s *= a.bot.slow;
  return s;
}

function stepSoldier(G, a, inp, dt) {
  if (!a.alive) {
    if (G.mode === "tdm") TD.deadTick(G, a, dt);
    return;
  }
  if (a.protectT > 0) a.protectT -= dt;
  a.fireCD -= dt; a.knifeCD -= dt; a.gCD -= dt; a.flash = Math.max(0, a.flash - dt);
  a.recoil = Math.max(0, a.recoil - dt * 6);
  if (a.knifeT > 0) a.knifeT -= dt;
  if (a.swapT > 0) a.swapT -= dt;
  // --- movement (remote guests move themselves; the host just takes their position)
  if (!a.remote) {
    let mx = inp.mx || 0, my = inp.my || 0;
    const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
    const sp = moveSpeed(G, a);
    const k = Math.min(1, dt * (a.down ? 6 : 13));
    a.vx += (mx * sp - a.vx) * k; a.vy += (my * sp - a.vy) * k;
    if (a.knifeT > 0.2 && a.lunge) { a.vx += a.lunge[0] * dt * 60; a.vy += a.lunge[1] * dt * 60; }
    moveCircle(G.map, G.map.solidP, a, a.vx * dt, a.vy * dt);
    if (G.leash) G.leash(G, a);
  } else if (a.netPos) {
    a.vx = (a.netPos[0] - a.x) / Math.max(dt, 0.001); a.vy = (a.netPos[1] - a.y) / Math.max(dt, 0.001);
    a.x = a.netPos[0]; a.y = a.netPos[1];
  }
  const spd = Math.hypot(a.vx, a.vy);
  a.walk += spd * dt * 0.06;
  if (spd > 20) a.moveAng = Math.atan2(a.vy, a.vx);
  // --- aim
  if (inp.aim !== undefined && inp.aim !== null) a.ang = a.bot ? inp.aim : turnTo(a.ang, inp.aim, dt * 30);
  else if (spd > 30 && !a.bot) a.ang = turnTo(a.ang, a.moveAng, dt * 10);
  // --- down (zombies "last stand"): crawl and fire the pistol, waiting for a revive
  if (a.down) { ZM.downTick(G, a, inp, dt); }
  // --- health regen
  const regenDelay = G.mode === "zombies" ? 3.0 : TDM.regenDelay;
  if (!a.down && G.time - a.hurtT > regenDelay && a.hp < a.maxHp) a.hp = Math.min(a.maxHp, a.hp + (G.mode === "zombies" ? 75 : TDM.regenRate) * dt);
  // --- weapon handling
  const slot = curSlot(a), d = wdef(slot);
  if (a.reloadT > 0) {
    a.reloadT -= dt;
    if (a.reloadT <= 0) {
      const need = d.mag - slot.mag, take = Math.min(need, slot.res);
      slot.mag += take; slot.res -= take; a.reloadT = 0;
      ev(G, { k: "snd", s: "reloadEnd", x: a.x, y: a.y, v: a.human ? 1 : 0.5, o: a.id });
    }
  }
  if (!inp.fire || a.fireCD < -0.2) a.spreadAdd = Math.max(0, a.spreadAdd - dt * 0.25);
  a.firing = false;
  const busy = a.reloadT > 0 || a.swapT > 0 || a.knifeT > 0.15;
  if (inp.swap && a.weapons.length > 1 && !a.down) { a.cur = 1 - a.cur; a.swapT = 0.38; a.reloadT = 0; ev(G, { k: "snd", s: "swap", x: a.x, y: a.y, v: 0.6, o: a.id }); }
  else if (inp.reload && !busy && slot.mag < d.mag && slot.res > 0) startReload(G, a);
  else if (inp.knife && a.knifeCD <= 0 && !a.down) knifeAttack(G, a);
  else if (inp.gren && a.frags > 0 && a.gCD <= 0 && !busy && !a.down) throwFrag(G, a, inp.grenDist);
  else if (inp.fire && !busy && a.fireCD <= 0) {
    if (slot.mag > 0) fireWeapon(G, a);
    else if (slot.res > 0) startReload(G, a);
    else {
      a.fireCD = 0.3; ev(G, { k: "snd", s: "dry", x: a.x, y: a.y, v: 0.6, o: a.id });
      const other = a.weapons[1 - a.cur];
      if (other && (other.mag > 0 || other.res > 0) && !a.down) { a.cur = 1 - a.cur; a.swapT = 0.38; }
    }
  }

  if (!inp.fire && slot.mag === 0 && slot.res > 0 && a.reloadT <= 0 && a.swapT <= 0) startReload(G, a);
  // --- interactions (humans only)
  if (a.human || (a.bot && a.bot.zombieBot)) handleUse(G, a, inp, dt);
  // knife lunge that connects a moment later
  if (a.pendingStab) {
    a.pendingStab.t -= dt;
    if (a.pendingStab.t <= 0) {
      const b = a.pendingStab.b; a.pendingStab = null;
      if (b.alive && dist(a.x, a.y, b.x, b.y) - b.r <= KNIFE.range + 14) {
        damage(G, b, b.kind === "zombie" ? KNIFE.zdmg : KNIFE.dmg, a, "knife", false, "knife", a.ang);
        ev(G, { k: "impact", x: b.x, y: b.y, a: a.ang, m: b.kind === "zombie" ? "zombie" : "flesh", o: a.id });
        ev(G, { k: "snd", s: "stab", x: b.x, y: b.y, v: 1, o: a.id });
      }
    }
  }
}

function startReload(G, a) {
  const d = curDef(a);
  let t = d.reload;
  if (hasPerk(a, "quick")) t *= 0.5;
  if (a.bot && G.mode === "tdm") t *= 1.1;
  a.reloadT = a.reloadDur = t;
  ev(G, { k: "snd", s: "reload", x: a.x, y: a.y, v: a.human ? 1 : 0.5, o: a.id, cls: d.cls });
}

/* ---------------- firing ---------------- */
function muzzle(G, a) {
  const L = a.r + 15, mx = a.x + Math.cos(a.ang) * L + Math.cos(a.ang + 1.57) * 4, my = a.y + Math.sin(a.ang) * L + Math.sin(a.ang + 1.57) * 4;
  // muzzle poking through a wall: fire from the body instead
  if (!los(G.map, a.x, a.y, mx, my, G.map.shot)) return [a.x, a.y];
  return [mx, my];
}

function fireWeapon(G, a) {
  const slot = curSlot(a), d = wdef(slot);
  let cd = 60 / d.rpm;
  if (hasPerk(a, "rapid")) cd *= 0.75;
  a.fireCD = cd;
  slot.mag--;
  a.firing = true; a.lastShot = G.time; a.recoil = 1; a.flash = 0.05; a.stats.shots++;
  const [mx, my] = muzzle(G, a);
  const moving = Math.hypot(a.vx, a.vy) > 40;
  let spread = d.spread + a.spreadAdd + (moving && d.moveSpread ? d.moveSpread : 0);
  if (a.down) spread += 0.04;
  a.spreadAdd = Math.min(0.11, a.spreadAdd + (d.kick || 0));
  const col = d.col || (d.cls === "volt" ? "#7ad7ff" : null);
  ev(G, { k: "flash", x: mx, y: my, a: a.ang, s: d.cls === "lmg" || d.cls === "shotgun" || d.cls === "sniper" ? 1.3 : d.cls === "pistol" ? 0.8 : 1, c: col, o: a.id });
  ev(G, { k: "snd", s: "gun", g: d.cls, x: a.x, y: a.y, v: 1, o: a.id, up: !!slot.up });
  if (d.cls !== "volt" && d.cls !== "launcher") ev(G, { k: "shell", x: a.x + Math.cos(a.ang) * 6, y: a.y + Math.sin(a.ang) * 6, a: a.ang, sg: d.cls === "shotgun" });
  if (d.explosive) {
    const ang = a.ang + rnd(-spread, spread);
    G.projs.push({ kind: "gl", x: mx, y: my, vx: Math.cos(ang) * d.explosive.speed, vy: Math.sin(ang) * d.explosive.speed, t: 2.2, owner: a, armD: 70, trav: 0,
      r: d.explosive.r, dmg: d.dmg, zdmg: d.zdmg || d.explosive.zdmg, wid: slot.id });
    return;
  }
  if (d.cls === "volt") { voltArc(G, a, mx, my, d); return; }
  const n = d.pellets || 1;
  for (let p = 0; p < n; p++) hitscan(G, a, mx, my, a.ang + (Math.random() * 2 - 1) * spread * (n > 1 ? 1 : Math.random() * 0.6 + 0.4), d, slot, p === 0);
}

function hitscan(G, a, mx, my, ang, d, slot, first) {
  const m = G.map, ux = Math.cos(ang), uy = Math.sin(ang);
  const maxD = Math.min(1700, d.range * (d.falloff >= 1 ? 1.2 : 2.4));
  const fromShooter = Math.hypot(mx - a.x, my - a.y);
  const wall = rayGrid(m, mx, my, ux, uy, maxD, m.shot, (i, dd) => dd + fromShooter > TILE * 1.25 && Math.random() < 0.5);
  let endD = wall.d;
  // actors along the ray
  const hits = [];
  for (const b of G.actors) {
    if (!targetable(G, a, b)) continue;
    const t = segCircle(mx, my, mx + ux * endD, my + uy * endD, b.x, b.y, b.r + (b.kind === "zombie" ? 3 : 1));
    if (t >= 0) hits.push([t * endD, b]);
  }
  hits.sort((p, q) => p[0] - q[0]);
  let pierce = d.pierce || 1, mul = 1, stopped = false;
  for (const [hd, b] of hits) {
    const dd = hd + fromShooter;
    let fall = dd <= d.range ? 1 : Math.max(d.falloff, 1 - (1 - d.falloff) * ((dd - d.range) / d.range));
    const crit = Math.random() < (d.crit || 0) * (b.kind === "zombie" && b.ztype === "brute" ? 0.5 : 1);
    const base = b.kind === "zombie" ? d.zdmg : d.dmg;
    let amt = base * fall * mul * (crit ? 2 : 1);
    if (slot.up && d.boom && b.kind === "zombie") { explode(G, mx + ux * hd, my + uy * hd, d.boom, 0, d.zdmg * 0.6, a, "pistolboom"); }
    damage(G, b, amt, a, "bullet", crit, slot.id, ang);
    a.stats.hits++;
    ev(G, { k: "impact", x: mx + ux * hd, y: my + uy * hd, a: ang, m: b.kind === "zombie" ? "zombie" : "flesh", crit, o: a.id });
    if (a.human) ev(G, { k: "hitmark", pid: a.id, kill: !b.alive });
    mul *= 0.75;
    if (--pierce <= 0) { endD = hd; stopped = true; break; }
  }
  // tracer (not every pellet, to keep the screen readable)
  if (first || Math.random() < 0.45) ev(G, { k: "tracer", x0: mx, y0: my, x1: mx + ux * endD, y1: my + uy * endD, c: d.col || null, w: d.cls === "sniper" || d.cls === "dmr" ? 2 : 1.3, o: a.id });
  if (!stopped && wall.i >= 0) {
    const ix = mx + ux * endD, iy = my + uy * endD;
    const t = m.tile[wall.i];
    if (t === T_BARREL) hitBarrel(G, m.barrelAt[wall.i], d.dmg, a);
    const mat = t === T_HIGH ? (m.ch[wall.i] === "v" ? "metal" : "wood") : t === T_TREE ? "wood" : t === T_LOW ? "sand" : t === T_BARREL ? "metal" : t === T_DOOR ? "metal" : "wall";
    ev(G, { k: "impact", x: ix, y: iy, a: ang, m: mat, nx: wall.nx, ny: wall.ny, o: a.id });
  } else if (!stopped && Math.random() < 0.25) {
    ev(G, { k: "impact", x: mx + ux * endD, y: my + uy * endD, a: ang, m: "ground" });
  }
}

/* Volt Caster: an arc that jumps from zombie to zombie */
function voltArc(G, a, mx, my, d) {
  const pts = [[mx, my]];
  let from = { x: mx, y: my }, hit = new Set();
  const cand = G.actors.filter((b) => targetable(G, a, b));
  let first = null, best = 1e9;
  for (const b of cand) {
    const dd = dist(mx, my, b.x, b.y); if (dd > d.range) continue;
    const da = Math.abs(angDiff(a.ang, angTo(mx, my, b.x, b.y)));
    if (da > 0.32) continue;
    if (!los(G.map, mx, my, b.x, b.y, G.map.shot)) continue;
    const score = dd + da * 600; if (score < best) { best = score; first = b; }
  }
  let cur = first;
  for (let n = 0; n < (d.chains || 5) && cur; n++) {
    hit.add(cur); pts.push([cur.x, cur.y]);
    damage(G, cur, d.zdmg, a, "volt", false, "volt", angTo(from.x, from.y, cur.x, cur.y));
    from = cur;
    let nb = null, nd = 190;
    for (const b of cand) { if (hit.has(b) || !b.alive) continue; const dd = dist(cur.x, cur.y, b.x, b.y); if (dd < nd && los(G.map, cur.x, cur.y, b.x, b.y, G.map.shot)) { nd = dd; nb = b; } }
    cur = nb;
  }
  if (!first) pts.push([mx + Math.cos(a.ang) * 300, my + Math.sin(a.ang) * 300]);
  ev(G, { k: "arc", pts, o: a.id });
}

/* ---------------- melee ---------------- */
function knifeAttack(G, a) {
  a.knifeCD = KNIFE.cd; a.knifeT = 0.35;
  ev(G, { k: "snd", s: "knife", x: a.x, y: a.y, v: 1, o: a.id });
  let best = null, bd = 1e9;
  for (const b of G.actors) {
    if (!targetable(G, a, b)) continue;
    const dd = dist(a.x, a.y, b.x, b.y) - b.r;
    if (dd > KNIFE.range + KNIFE.lunge) continue;
    const da = Math.abs(angDiff(a.ang, angTo(a.x, a.y, b.x, b.y)));
    if (da > KNIFE.arc && dd > 10) continue;
    if (dd < bd) { bd = dd; best = b; }
  }
  a.lunge = null;
  if (best) {
    a.ang = angTo(a.x, a.y, best.x, best.y);
    if (bd > KNIFE.range) { a.lunge = [Math.cos(a.ang) * 9, Math.sin(a.ang) * 9]; }
    if (bd <= KNIFE.range + 10) {
      damage(G, best, best.kind === "zombie" ? KNIFE.zdmg : KNIFE.dmg, a, "knife", false, "knife", a.ang);
      ev(G, { k: "impact", x: best.x, y: best.y, a: a.ang, m: best.kind === "zombie" ? "zombie" : "flesh" });
      ev(G, { k: "snd", s: "stab", x: best.x, y: best.y, v: 1 });
      if (best.kind === "zombie" && best.alive && !(G.net && G.net.role === "guest")) { best.vx += Math.cos(a.ang) * 220; best.vy += Math.sin(a.ang) * 220; best.stun = 0.25; }
    } else a.pendingStab = { t: 0.12, b: best };
  }
}

/* ---------------- grenades & projectiles ---------------- */
function throwFrag(G, a, want) {
  a.frags--; a.gCD = 0.9;
  if (G.net && G.net.role === "guest") { ev(G, { k: "snd", s: "throw", x: a.x, y: a.y, v: 1 }); return; }   // the host throws it
  const dd = clamp(want || 280, 90, 460);
  // with friction k the throw travels v/k: pick v for the wanted distance
  const k = 2.6, v = dd * k;
  const [mx, my] = muzzle(G, a);
  G.projs.push({ kind: "frag", x: mx, y: my, vx: Math.cos(a.ang) * v, vy: Math.sin(a.ang) * v, t: FRAG.fuse, owner: a, fr: k, h: 0, vh: 160 });
  ev(G, { k: "snd", s: "throw", x: a.x, y: a.y, v: 1, o: a.id });
}

function stepProjectiles(G, dt) {
  const m = G.map;
  for (const p of G.projs) {
    p.t -= dt;
    if (p.kind === "shell") { if (p.t <= 0) { explode(G, p.x, p.y, p.r, p.dmg, p.zdmg, p.owner, "air"); p.dead = true; } continue; }
    const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
    if (p.kind === "gl") {
      p.trav += Math.hypot(p.vx, p.vy) * dt;
      let boom = false;
      if (isSolidAt(m, m.shot, nx, ny)) boom = true;
      for (const b of G.actors) if (!boom && targetable(G, p.owner, b) && dist2(nx, ny, b.x, b.y) < (b.r + 6) * (b.r + 6)) boom = true;
      if (boom && p.trav >= p.armD) { explode(G, p.x, p.y, p.r, p.dmg, p.zdmg, p.owner, "gl"); p.dead = true; continue; }
      if (boom) { p.vx *= -0.3; p.vy *= -0.3; p.kind = "frag"; p.t = Math.min(p.t, 0.9); p.fr = 3; p.r = p.r; continue; }
      p.x = nx; p.y = ny;
      if (p.t <= 0) { explode(G, p.x, p.y, p.r, p.dmg, p.zdmg, p.owner, "gl"); p.dead = true; }
      continue;
    }
    // frag: bounce off anything bullets can't pass
    if (isSolidAt(m, m.shot, nx, p.y)) { p.vx *= -0.45; ev(G, { k: "snd", s: "clink", x: p.x, y: p.y, v: 0.5 }); } else p.x = nx;
    if (isSolidAt(m, m.shot, p.x, ny)) { p.vy *= -0.45; ev(G, { k: "snd", s: "clink", x: p.x, y: p.y, v: 0.5 }); } else p.y = ny;
    const f = Math.max(0, 1 - p.fr * dt); p.vx *= f; p.vy *= f;
    p.vh -= 520 * dt; p.h = Math.max(0, p.h + p.vh * dt); if (p.h === 0 && p.vh < 0) p.vh = -p.vh * 0.35;
    if (p.t <= 0) { explode(G, p.x, p.y, p.r || FRAG.r, p.dmg || FRAG.dmg, p.zdmg || FRAG.zdmg, p.owner, "frag"); p.dead = true; }
  }
  G.projs = G.projs.filter((p) => !p.dead);
}

/* Explosion: damages everything in range that isn't behind a wall. kind "zboom" = an exploding zombie (hurts players). */
function explode(G, x, y, r, dmg, zdmg, owner, kind) {
  const m = G.map;
  ev(G, { k: "boom", x, y, r, kind });
  for (const b of G.actors) {
    if (!b.alive) continue;
    const dd = dist(x, y, b.x, b.y) - b.r * 0.5;
    if (dd > r) continue;
    if (!los(m, x, y, b.x, b.y, m.shot)) continue;
    const f = Math.pow(1 - clamp(dd / r, 0, 1), 0.7);
    if (b.kind === "zombie") {
      if (kind === "zboom" || !owner || owner.kind === "soldier") {
        damage(G, b, zdmg * f, owner && owner.kind === "soldier" ? owner : null, "boom", false, kind, angTo(x, y, b.x, b.y));
        if (b.alive) { b.vx += (b.x - x) * 4; b.vy += (b.y - y) * 4; }
      }
    } else {
      if (b.down || b.protectT > 0) continue;
      if (G.mode === "zombies") {
        if (kind === "zboom") damage(G, b, dmg * f, null, "boom", false, kind);
        continue;                          // no self / friendly explosive damage in zombies
      }
      if (owner && owner.kind === "soldier" && owner !== b && owner.team === b.team) continue;    // no friendly fire
      damage(G, b, (owner === b ? 0.5 : 1) * dmg * f, owner, "boom", false, kind, angTo(x, y, b.x, b.y));
    }
  }
  // chain barrels
  for (let k = 0; k < m.barrels.length; k++) {
    const br = m.barrels[k];
    if (br.alive && dist(x, y, br.wx, br.wy) < r * 0.9) hitBarrel(G, k, 999, owner);
  }
}

function hitBarrel(G, k, amt, by) {
  const b = G.map.barrels[k];
  if (!b || !b.alive) return;
  b.hp -= amt;
  if (b.hp > 0) { ev(G, { k: "impact", x: b.wx, y: b.wy, a: 0, m: "metal" }); return; }
  b.alive = false;
  refreshTile(G.map, b.i);
  ev(G, { k: "barrel", i: k });
  // a short delay feels better and lets chains ripple
  G.projs.push({ kind: "shell", x: b.wx, y: b.wy, t: 0.12, r: 135, dmg: 140, zdmg: 1600, owner: by && by.kind === "soldier" ? by : null });
}

/* ---------------- damage ---------------- */
function damage(G, v, amt, src, how, crit, wid, ang) {
  if (!v.alive || amt <= 0) return;
  if (G.net && G.net.role === "guest") return;     // the host decides all damage
  if (v.kind === "zombie") { ZM.damageZombie(G, v, amt, src, how, crit, wid, ang); return; }
  if (v.down || v.protectT > 0) return;
  if (G.godMode && v.kind === "soldier") return;
  v.hp -= amt; v.hurtT = G.time;
  ev(G, { k: "hurt", id: v.id, amt, x: v.x, y: v.y, a: ang === undefined ? (src ? angTo(src.x, src.y, v.x, v.y) : 0) : ang, from: src ? [src.x, src.y] : null });
  if (src && src.kind === "soldier") src.lastHit = G.time;
  if (v.hp <= 0) {
    v.hp = 0;
    if (G.mode === "zombies") ZM.playerDown(G, v);
    else TD.kill(G, v, src, how, wid, crit);
  }
}

/* ---------------- weapon drops on the ground ---------------- */
function dropWeapon(G, x, y, slot, life = 25) {
  if (!slot || slot.id === "p9" && !slot.up && G.mode === "tdm") return;
  const d = { id: G.nextId++, wid: slot.id, up: slot.up, mag: slot.mag, res: slot.res, x: x + rnd(-6, 6), y: y + rnd(-6, 6), t: life, a: rnd(TAU) };
  G.drops.push(d);
  ev(G, { k: "drop", id: d.id });
  return d;
}
function stepDrops(G, dt) {
  for (const d of G.drops) {
    d.t -= dt;
    // walking over a gun you already carry takes its ammo
    for (const a of G.actors) {
      if (a.kind !== "soldier" || !a.alive || a.down || d.t <= 0) continue;
      if (dist2(a.x, a.y, d.x, d.y) > 26 * 26) continue;
      const s = a.weapons.find((w) => w.id === d.wid);
      if (s) {
        const def = wdef(s), max = def.res;
        const take = Math.min(max - s.res, d.mag + d.res);
        if (take > 0) { s.res += take; d.t = 0; if (a.human) ev(G, { k: "toast", pid: a.id, t: "+" + take + " AMMO" }); ev(G, { k: "snd", s: "ammo", x: d.x, y: d.y, v: 0.7, o: a.id }); }
      }
    }
  }
  G.drops = G.drops.filter((d) => d.t > 0);
}
function takeDrop(G, a, d) {
  if (d.t <= 0) return;
  const slot = { id: d.wid, up: d.up, mag: d.mag, res: d.res };
  if (a.weapons.length < 2) { a.weapons.push(slot); a.cur = a.weapons.length - 1; }
  else { const old = a.weapons[a.cur]; a.weapons[a.cur] = slot; dropWeapon(G, a.x, a.y, old, 20); }
  d.t = 0; a.swapT = 0.35; a.reloadT = 0;
  ev(G, { k: "snd", s: "pickup", x: a.x, y: a.y, v: 1, o: a.id });
}

/* ---------------- USE button: the best thing to interact with nearby ---------------- */
function handleUse(G, a, inp, dt) {
  if (!a.alive || a.down) { a.prompt = null; return; }
  const p = G.mode === "zombies" ? ZM.prompt(G, a) : null;
  let best = p;
  if (!best) {
    let bd = 40;
    for (const d of G.drops) {
      const dd = dist(a.x, a.y, d.x, d.y);
      if (dd < bd && !a.weapons.some((w) => w.id === d.wid)) { bd = dd; best = { key: "drop" + d.id, label: "SWAP FOR " + wdef({ id: d.wid, up: d.up }).name.toUpperCase(), can: true, act: () => takeDrop(G, a, d) }; }
    }
  }
  a.prompt = best;
  if (!best) { a.holdT = 0; return; }
  if (G.net && G.net.role === "guest") { if (best.hold && inp.useHold && best.can) { if (a.holdKey !== best.key) { a.holdKey = best.key; a.holdT = 0; } a.holdT = Math.min(best.hold, a.holdT + dt); } else a.holdT = 0; return; }
  if (best.hold) {
    if (inp.useHold && best.can) {
      if (a.holdKey !== best.key) { a.holdKey = best.key; a.holdT = 0; }
      a.holdT += dt;
      best.tick && best.tick(dt);
      if (a.holdT >= best.hold) { a.holdT = 0; best.act(); }
    } else { a.holdT = 0; a.holdKey = null; }
  } else if (inp.use) {
    if (best.can) best.act();
    else { ev(G, { k: "snd", s: "deny", x: a.x, y: a.y, v: 0.8, o: a.id }); ev(G, { k: "toast", pid: a.id, t: best.why || "NOT ENOUGH POINTS" }); }
  }
}

/* ---------------- aim helpers ---------------- */
// aim assist for thumbs: nudge the aim toward the best enemy inside a small cone
function aimAssist(G, a, ang, cone = 0.2, range = 650) {
  let best = null, bs = 1e9;
  for (const b of G.actors) {
    if (!targetable(G, a, b)) continue;
    const dd = dist(a.x, a.y, b.x, b.y); if (dd > range) continue;
    const ta = angTo(a.x, a.y, b.x, b.y), da = Math.abs(angDiff(ang, ta));
    const allow = cone + Math.atan2(b.r, dd);
    if (da > allow) continue;
    if (!los(G.map, a.x, a.y, b.x, b.y, G.map.shot)) continue;
    const s = da * 400 + dd * 0.4; if (s < bs) { bs = s; best = ta; }
  }
  if (best === null) return ang;
  return ang + angDiff(ang, best) * 0.7;
}
// auto-aim for keyboard players sharing one keyboard: nearest visible enemy in front
function autoAim(G, a, facing, range = 620, cone = 1.2) {
  let best = null, bs = 1e9;
  for (const b of G.actors) {
    if (!targetable(G, a, b)) continue;
    const dd = dist(a.x, a.y, b.x, b.y); if (dd > range) continue;
    const ta = angTo(a.x, a.y, b.x, b.y), da = Math.abs(angDiff(facing, ta));
    if (da > cone) continue;
    if (!los(G.map, a.x, a.y, b.x, b.y, G.map.shot)) continue;
    const s = dd + da * 200; if (s < bs) { bs = s; best = ta; }
  }
  return best;
}

// ===== zombies.js =====
/* ZOMBIES mode: endless rounds, windows, doors, wall guns, mystery box, perks, power, Forge, power-ups, last stand. */

const ZM = {};

ZM.init = function (G) {
  const m = G.map, cfg = G.cfg;
  // which areas touch each other through windows (zombies in a closed area next to an open one still spawn)
  m.winAdj = Array.from({ length: m.areaN }, () => new Set());
  for (const w of m.windows) for (const a of w.sides) for (const b of w.sides) if (a !== b) m.winAdj[a].add(b);
  const startSpot = m.boxSpots.findIndex((s) => s.area === m.startArea);
  G.z = {
    round: 0, phase: "pre", phaseT: cfg.demo ? 1 : 4, total: 0, spawned: 0, killed: 0, spawnT: 0, hound: false,
    open: new Set([m.startArea]), power: false, field: new Float32Array(m.N), fieldT: 0,
    box: { spot: startSpot >= 0 ? startSpot : 0, state: "idle", t: 0, wid: null, user: null, uses: 0, limit: rndi(6, 11) },
    timers: { double: 0, insta: 0, sale: 0 }, drops: { n: 0, last: -99 }, boardPts: {}, versus: cfg.variant === "versus",
    windSolo: 0, lastKill: null, totalKills: 0, best: 0,
  };
  // players
  const st = m.start || m.spawns[0][0];
  const offs = [[0, 0], [1, 0], [-1, 0], [0, 1]];
  (cfg.players || []).forEach((p, k) => {
    const t = nearestOpen(m, st.wx + offs[k][0] * TILE, st.wy + offs[k][1] * TILE);
    const [x, y] = tileCenter(m, t);
    const a = makeSoldier(G, { human: !p.bot, pidx: p.pidx, remote: p.remote, netId: p.netId, op: p.op, name: p.name, x, y, ang: -Math.PI / 2, hp: 150, weapons: [newSlot("p9")], frags: 2, team: 0,
      bot: p.bot ? { zombieBot: true, t: 0 } : null });
    a.points = POINTS.start;
  });
};

ZM.players = (G) => G.actors.filter((a) => a.kind === "soldier");
ZM.soloLike = (G) => ZM.players(G).length < 2 || G.z.versus;

/* ---------------- step ---------------- */
ZM.step = function (G, dt) {
  const Z = G.z, m = G.map;
  for (const k in Z.timers) if (Z.timers[k] > 0) { Z.timers[k] -= dt; if (Z.timers[k] <= 0) ev(G, { k: "pu_end", t: k }); }
  // rounds
  Z.phaseT -= dt;
  if (Z.phase === "pre" && Z.phaseT <= 0) ZM.startRound(G);
  if (Z.phase === "live") {
    const alive = G.actors.reduce((n, a) => n + (a.kind === "zombie" && a.alive ? 1 : 0), 0);
    Z.alive = alive;
    Z.spawnT -= dt;
    // hounds come in small packs; zombies keep trickling in
    const cap = Z.hound ? (ZM.players(G).length > 1 ? 5 : 3) : ZM.players(G).length > 1 ? 26 : ZCAP;
    if (Z.spawned < Z.total && alive < cap && Z.spawnT <= 0) {
      ZM.spawnOne(G);
      Z.spawnT = Z.hound ? rnd(1.1, 2.2) : clamp(2.1 - Z.round * 0.085, 0.4, 2.1) * rnd(0.7, 1.3);
    }
    if (Z.spawned >= Z.total && alive === 0) ZM.endRound(G);
  }
  if (Z.phase === "break" && Z.phaseT <= 0) { Z.phase = "pre"; Z.phaseT = 0.01; }
  // flow field toward every soldier who can be attacked
  Z.fieldT -= dt;
  if (Z.fieldT <= 0) {
    Z.fieldT = 0.3;
    const tg = G.actors.filter((a) => a.kind === "soldier" && a.alive && !a.down).map((a) => tileOf(m, a.x, a.y));
    if (tg.length) zombieField(m, tg, Z.field);
  }
  for (const a of G.actors) if (a.kind === "zombie" && a.alive) ZM.stepZombie(G, a, dt);
  // power-ups
  for (const p of G.powerups) {
    p.t -= dt;
    for (const a of G.actors) if (a.kind === "soldier" && a.alive && !a.down && p.t > 0 && dist2(a.x, a.y, p.x, p.y) < 34 * 34) { ZM.takePowerup(G, p, a); p.t = 0; }
  }
  G.powerups = G.powerups.filter((p) => p.t > 0);
  // mystery box timers
  const B = Z.box;
  if (B.state !== "idle") {
    B.t -= dt;
    if (B.state === "spin" && B.t <= 0) {
      if (B.uses >= B.limit && Math.random() < 0.55 && m.boxSpots.length > 1) {
        B.state = "skull"; B.t = 2.4; if (B.user) B.user.points += Z.timers.sale > 0 ? FIRESALE_BOX : BOX_COST;
        ev(G, { k: "snd", s: "skull", x: m.boxSpots[B.spot].wx, y: m.boxSpots[B.spot].wy, v: 1 });
        ev(G, { k: "toast", pid: B.user && B.user.id, t: "THE BOX IS MOVING · REFUNDED" });
      } else { B.state = "offer"; B.t = 9; B.wid = ZM.rollBox(G, B.user); ev(G, { k: "snd", s: "boxdone", x: m.boxSpots[B.spot].wx, y: m.boxSpots[B.spot].wy, v: 1 }); }
    } else if (B.state === "offer" && B.t <= 0) { B.state = "idle"; B.wid = null; B.user = null; }
    else if (B.state === "skull" && B.t <= 0) { B.state = "gone"; B.t = 3; }
    else if (B.state === "gone" && B.t <= 0) {
      let n = B.spot; while (n === B.spot) n = rndi(0, m.boxSpots.length - 1);
      B.spot = n; B.state = "idle"; B.uses = 0; B.limit = rndi(6, 11); B.user = null;
      ev(G, { k: "boxmove", spot: n });
    }
  }
  // game over: nobody left standing
  const ps = ZM.players(G);
  if (!G.over && ps.length && ps.every((a) => !a.alive || (a.down && !a.selfRev))) {
    G.overT = (G.overT || 0) + dt;
    if (G.overT > (ps.some((a) => a.alive) ? 0.4 : 1.5)) ZM.gameOver(G);
  } else if (!G.over) G.overT = 0;
};

ZM.startRound = function (G) {
  const Z = G.z;
  Z.round++;
  Z.hound = Z.round % HOUND_EVERY === 0 && Z.round >= HOUND_EVERY;
  const np = ZM.players(G).filter((a) => a.alive).length;
  Z.total = Z.hound ? Math.round(Math.min(24, 4 + Z.round * 0.9) * (np > 1 ? 1.5 : 1)) : zombieCount(Z.round, np);
  if (G.cfg.demo) Z.total = Math.min(Z.total, 14);
  Z.spawned = 0; Z.killed = 0; Z.spawnT = 1.2; Z.phase = "live"; Z.boardPts = {};
  // perma-perks? no. Every round you get one frag back (max 4)
  for (const a of ZM.players(G)) if (a.alive && Z.round > 1) a.frags = Math.min(FRAG.max, a.frags + 1);
  ev(G, { k: "round", n: Z.round, hound: Z.hound });
};

ZM.endRound = function (G) {
  const Z = G.z;
  Z.phase = "break"; Z.phaseT = Z.round === 1 ? 7 : 9;
  Z.best = Math.max(Z.best, Z.round);
  ev(G, { k: "roundEnd", n: Z.round });
  if (Z.hound && Z.lastKill) ZM.spawnPowerup(G, Z.lastKill[0], Z.lastKill[1], "ammo");
  Z.drops.n = 0;
  // revive anyone who bled out in co-op? no — but downed players get up at round end (classic rule)
  // anyone who bled out in co-op comes back next round (if a teammate is still standing)
  for (const a of ZM.players(G)) if (!a.alive && !G.z.versus && ZM.players(G).some((b) => b.alive && !b.down)) ZM.respawnPlayer(G, a);
};

ZM.respawnPlayer = function (G, a) {
  const alive = ZM.players(G).find((b) => b.alive && !b.down);
  const t = nearestOpen(G.map, alive.x + 30, alive.y);
  [a.x, a.y] = tileCenter(G.map, t);
  a.tp = (a.tp || 0) + 1;
  a.alive = true; a.down = false; a.hp = a.maxHp = 150; a.perks = []; a.weapons = [newSlot("p9")]; a.cur = 0; a.frags = 2; a.protectT = 2;
  ev(G, { k: "toast", t: a.name + " IS BACK" });
};

ZM.gameOver = function (G) {
  G.over = true; G.overT = 0;
  const ps = ZM.players(G);
  if (G.z.versus) G.winner = ps.reduce((b, a) => (a.points > b.points ? a : b), ps[0]);
  ev(G, { k: "gameover", round: G.z.round });
};

/* ---------------- spawning ---------------- */
ZM.spawnerActive = function (G, s) {
  const Z = G.z, m = G.map;
  if (s.area < 0) return false;
  if (Z.open.has(s.area)) return true;
  for (const b of m.winAdj[s.area]) if (Z.open.has(b)) return true;
  return false;
};

ZM.spawnOne = function (G) {
  const Z = G.z, m = G.map;
  const ps = ZM.players(G).filter((a) => a.alive && !a.down);
  if (!ps.length) return;
  let x, y, type;
  if (Z.hound) {
    // hounds appear out of a lightning strike somewhere around the players
    type = "hound";
    const p = pick(ps);
    for (let tries = 0; tries < 40; tries++) {
      const ang = rnd(TAU), d = rnd(330, 620);
      const t = tileOf(m, p.x + Math.cos(ang) * d, p.y + Math.sin(ang) * d);
      if (t < 0 || m.solidP[t] || !Z.open.has(m.area[t])) continue;
      [x, y] = tileCenter(m, t); break;
    }
    if (x === undefined) { const s = ZM.pickSpawner(G, ps); if (!s) return; x = s.wx; y = s.wy; }
    ev(G, { k: "lightning", x, y });
  } else {
    const s = ZM.pickSpawner(G, ps);
    if (!s) return;
    x = s.wx + rnd(-8, 8); y = s.wy + rnd(-8, 8);
    type = ZM.rollType(G);
  }
  ZM.makeZombie(G, type, x, y);
  Z.spawned++;
};

ZM.pickSpawner = function (G, ps) {
  const m = G.map;
  const list = [];
  for (const s of m.spawners) {
    if (!ZM.spawnerActive(G, s)) continue;
    let dmin = 1e9, seen = false;
    for (const p of ps) { const d = dist(s.wx, s.wy, p.x, p.y); dmin = Math.min(dmin, d); if (d < 260 && los(m, s.wx, s.wy, p.x, p.y, m.sight)) seen = true; }
    if (seen) continue;
    // prefer spawners a little way off, never right on top of a player
    const w = dmin < 200 ? 0.05 : dmin < 1100 ? 1 : dmin < 1700 ? 0.35 : 0.08;
    list.push([s, w]);
  }
  if (!list.length) return m.spawners.find((s) => ZM.spawnerActive(G, s)) || null;
  let tot = list.reduce((t, l) => t + l[1], 0), r = Math.random() * tot;
  for (const [s, w] of list) { r -= w; if (r <= 0) return s; }
  return list[0][0];
};

ZM.rollType = function (G) {
  const r = G.z.round, x = Math.random();
  const brutes = G.actors.filter((a) => a.alive && a.ztype === "brute").length;
  if (r >= 8 && brutes < 1 + Math.floor((r - 8) / 6) && x < 0.035 + r * 0.002) return "brute";
  if (r >= 6 && x < 0.12) return "exploder";
  if (r >= 3 && x < 0.2) return "soldier";
  return "walker";
};

ZM.makeZombie = function (G, type, x, y) {
  const Z = G.z, T = ZTYPES[type], r = Z.round;
  let speed;
  if (type === "hound") speed = rnd(160, 176);
  else if (type === "brute") speed = rnd(62, 72);
  else if (type === "exploder") speed = rnd(52, 64);
  else {
    const run = Math.random() < clamp((r - 3) * 0.12, 0, 0.92), sprint = run && Math.random() < clamp((r - 9) * 0.08, 0, 0.7);
    speed = sprint ? rnd(136, 150) : run ? rnd(96, 118) : rnd(36, 56);
  }
  const hp = zombieHp(r) * T.hp * (G.cfg.demo ? 0.5 : 1);
  const a = { id: G.nextId++, kind: "zombie", ztype: type, x, y, vx: 0, vy: 0, r: T.r, ang: rnd(TAU), hp, maxHp: hp, alive: true, speed,
    rise: type === "hound" ? 0.35 : 1.1, atkT: 0, atkCD: 0, walk: rnd(10), look: Math.floor(rnd(1000)), stun: 0, stuckT: 0, prog: [x, y], tearT: 0, fuse: 0, chargeT: 0, chargeCD: 2, flinch: 0, groanT: rnd(2, 7) };
  G.actors.push(a);
  if (type !== "hound") ev(G, { k: "rise", x, y });
  return a;
};

/* ---------------- zombie brain ---------------- */
const _near = [];
ZM.stepZombie = function (G, z, dt) {
  const m = G.map, Z = G.z, T = ZTYPES[z.ztype];
  if (z.rise > 0) { z.rise -= dt; return; }
  z.walk += dt * (z.speed / 22);
  if (z.groanT -= dt, z.groanT <= 0) { z.groanT = rnd(3, 9); ev(G, { k: "snd", s: z.ztype === "hound" ? "growl" : "groan", x: z.x, y: z.y, v: 0.6, zt: z.ztype }); }
  // target = closest soldier who can be attacked
  let tgt = null, td = 1e9;
  for (const a of G.actors) if (a.kind === "soldier" && a.alive && !a.down) { const d = dist2(z.x, z.y, a.x, a.y); if (d < td) { td = d; tgt = a; } }
  td = Math.sqrt(td);
  if (z.stun > 0) { z.stun -= dt; z.vx *= 0.85; z.vy *= 0.85; moveCircle(m, m.solidZ, z, z.vx * dt, z.vy * dt); return; }
  if (z.flinch > 0) z.flinch -= dt;
  if (z.atkCD > 0) z.atkCD -= dt;
  if (z.chargeCD > 0) z.chargeCD -= dt;
  // exploder fuse
  if (z.fuse > 0) { z.fuse -= dt; if (z.fuse <= 0) { ZM.zombieBoom(G, z); return; } }
  let dx = 0, dy = 0, sp = z.speed * (z.flinch > 0 ? 0.55 : 1);
  if (!tgt) { z.vx *= 0.9; z.vy *= 0.9; return; }
  const ti = tileOf(m, z.x, z.y);
  // brute charge
  if (z.chargeT > 0) {
    z.chargeT -= dt;
    dx = Math.cos(z.ang); dy = Math.sin(z.ang); sp = T.charge;
    if (td < z.r + tgt.r + 6 && !z.chargeHit) { z.chargeHit = true; damage(G, tgt, 70, z, "zombie"); tgt.vx += dx * 520; tgt.vy += dy * 520; ev(G, { k: "snd", s: "slam", x: z.x, y: z.y, v: 1 }); z.chargeT = 0; }
  } else {
    let direct = td < 150 && los(m, z.x, z.y, tgt.x, tgt.y, m.solidZ);
    if (direct) { dx = tgt.x - z.x; dy = tgt.y - z.y; }
    else if (ti >= 0) {
      // follow the flow field: step to the cheapest neighbouring tile
      const W = m.W, x = ti % W, y = (ti / W) | 0;
      let best = -1, bd = Z.field[ti];
      for (const [ddx, ddy] of DIRS8) {
        const nx = x + ddx, ny = y + ddy; if (nx < 0 || ny < 0 || nx >= W || ny >= m.H) continue;
        const j = ny * W + nx;
        if (ddx && ddy && (m.solidZ[y * W + nx] || m.solidZ[ny * W + x] || m.tile[y * W + nx] === T_WINDOW || m.tile[ny * W + x] === T_WINDOW)) continue;
        if (Z.field[j] < bd) { bd = Z.field[j]; best = j; }
      }
      if (best >= 0) {
        // boarded window in the way: stand at it and tear the boards off
        if (m.tile[best] === T_WINDOW && m.windows[m.winAt[best]].boards > 0) {
          const w = m.windows[m.winAt[best]];
          const [cx, cy] = tileCenter(m, best);
          const ox = w.ori === 0 ? 0 : sign(z.x - cx) * (TILE * 0.5 + z.r + 1), oy = w.ori === 0 ? sign(z.y - cy) * (TILE * 0.5 + z.r + 1) : 0;
          dx = cx + ox - z.x; dy = cy + oy - z.y;
          if (Math.hypot(dx, dy) < 10) { dx = dy = 0; z.ang = angTo(z.x, z.y, cx, cy); }
          z.tearT += dt;
          if (z.tearT > (z.ztype === "brute" ? 0.5 : 1.15) && Math.hypot(z.x - cx, z.y - cy) < TILE + z.r + 8) {
            z.tearT = 0; w.boards--; refreshTile(m, w.i);
            ev(G, { k: "board", w: m.winAt[best], n: w.boards, x: cx, y: cy });
          }
        } else {
          z.tearT = 0;
          const [cx, cy] = tileCenter(m, best);
          dx = cx - z.x; dy = cy - z.y;
          // climbing through an open window is slow
          if (m.tile[ti] === T_WINDOW) sp *= 0.45;
        }
      }
    }
    // brute: start a charge when it has a clear run at you
    if (z.ztype === "brute" && z.chargeCD <= 0 && td < 240 && td > 70 && los(m, z.x, z.y, tgt.x, tgt.y, m.solidZ)) {
      z.chargeT = 0.75; z.chargeHit = false; z.chargeCD = rnd(4, 6); z.ang = angTo(z.x, z.y, tgt.x, tgt.y);
      ev(G, { k: "snd", s: "roar", x: z.x, y: z.y, v: 1 });
    }
  }
  // attack
  if (z.atkT > 0) {
    z.atkT -= dt; sp *= 0.3;
    if (z.atkT <= 0) {
      if (tgt && td - tgt.r < T.reach * 1.35) {
        damage(G, tgt, T.dmg, z, "zombie");
        ev(G, { k: "swipe", x: z.x, y: z.y, a: z.ang, id: z.id });
      }
      z.atkCD = T.cd;
    }
  } else if (tgt && td - tgt.r < T.reach && z.atkCD <= 0 && z.chargeT <= 0) {
    if (z.ztype === "exploder") { if (z.fuse <= 0) { z.fuse = 0.6; ev(G, { k: "snd", s: "hiss", x: z.x, y: z.y, v: 1 }); } }
    else { z.atkT = T.windup; z.ang = angTo(z.x, z.y, tgt.x, tgt.y); ev(G, { k: "snd", s: z.ztype === "hound" ? "bark" : "snarl", x: z.x, y: z.y, v: 0.8 }); }
  }
  const dl = Math.hypot(dx, dy);
  let wx = 0, wy = 0;
  if (dl > 0.01) { wx = (dx / dl) * sp; wy = (dy / dl) * sp; if (z.chargeT <= 0 && z.atkT <= 0) z.ang = turnTo(z.ang, Math.atan2(dy, dx), dt * 7); }
  // keep apart from other zombies; push into players a little (they can body-block you)
  hashQuery(G.hash, z.x, z.y, 40, _near);
  for (const o of _near) {
    if (o === z || !o.alive) continue;
    const ox = z.x - o.x, oy = z.y - o.y, d2 = ox * ox + oy * oy, rr = z.r + o.r;
    if (d2 > rr * rr || d2 < 0.01) continue;
    const d = Math.sqrt(d2), push = (rr - d) / d;
    if (o.kind === "zombie") { wx += ox * push * 9; wy += oy * push * 9; }
    else if (!o.down) { z.x += ox * push * 0.6; z.y += oy * push * 0.6; if (!o.remote) { o.x -= ox * push * 0.12; o.y -= oy * push * 0.12; resolveCircle(m, m.solidP, o); } }
  }
  const k = Math.min(1, dt * 8);
  z.vx += (wx - z.vx) * k; z.vy += (wy - z.vy) * k;
  moveCircle(m, m.solidZ, z, z.vx * dt, z.vy * dt);
  // stuck far away for a long time: send it back to a spawner (as in the classic games)
  z.stuckT += dt;
  if (z.stuckT > 4) {
    const moved = dist(z.x, z.y, z.prog[0], z.prog[1]);
    z.prog = [z.x, z.y]; z.stuckT = 0;
    z.stuckN = moved < 30 && z.tearT === 0 && z.atkT <= 0 && td > 70 ? (z.stuckN || 0) + 1 : 0;
    if ((moved < 30 && td > 500 && z.tearT === 0 && z.atkT <= 0) || z.stuckN >= 3) {
      z.stuckN = 0;
      const ps = ZM.players(G).filter((a) => a.alive && !a.down);
      const s = ZM.pickSpawner(G, ps);
      if (s) { z.x = s.wx; z.y = s.wy; z.rise = 0.8; z.prog = [z.x, z.y]; ev(G, { k: "rise", x: z.x, y: z.y }); }
    }
  }
};

ZM.zombieBoom = function (G, z) {
  if (!z.alive) return;
  z.alive = false; z.hp = 0;
  const B = ZTYPES.exploder.boom;
  ev(G, { k: "die", id: z.id, x: z.x, y: z.y, a: z.ang, zt: "exploder", look: z.look, gib: true });
  explode(G, z.x, z.y, B.r, B.pdmg, B.zdmg, null, "zboom");
  G.z.killed++;
};

ZM.damageZombie = function (G, z, amt, src, how, crit, wid, ang) {
  const Z = G.z;
  if (!z.alive) return;
  const killer = src && src.kind === "soldier" ? src : null;
  if (Z.timers.insta > 0 && z.ztype !== "brute") amt = z.hp + 1;
  if (Z.timers.insta > 0 && z.ztype === "brute") amt *= 3;
  z.hp -= amt;
  z.flinch = 0.12;
  if (ang !== undefined && z.ztype !== "brute") { z.vx += Math.cos(ang) * 60; z.vy += Math.sin(ang) * 60; }
  const mult = Z.timers.double > 0 ? 2 : 1;
  if (killer && how !== "nuke") { killer.points += POINTS.hit * mult; }
  if (z.hp > 0) { if (how !== "boom") ev(G, { k: "zhit", id: z.id, x: z.x, y: z.y, a: ang || 0, crit }); return; }
  // dead
  z.alive = false;
  Z.killed++; Z.totalKills++;
  Z.lastKill = [z.x, z.y];
  if (killer) {
    const pts = how === "knife" ? POINTS.knife : crit ? POINTS.crit : POINTS.kill;
    const gain = how === "nuke" ? 0 : (pts + (ZTYPES[z.ztype].pts - 50)) * mult;
    killer.points += gain; killer.kills++;
    if (crit) killer.crits++;
    ev(G, { k: "pts", pid: killer.id, n: gain + POINTS.hit * mult, x: z.x, y: z.y });
  }
  ev(G, { k: "die", id: z.id, x: z.x, y: z.y, a: ang === undefined ? z.ang : ang, zt: z.ztype, look: z.look, crit, gib: how === "boom" || (crit && Math.random() < 0.5) || wid === "longbow" });
  if (z.ztype === "exploder") { explode(G, z.x, z.y, ZTYPES.exploder.boom.r, ZTYPES.exploder.boom.pdmg, ZTYPES.exploder.boom.zdmg, null, "zboom"); }
  // soldier zombies sometimes drop the gun they were carrying
  if (z.ztype === "soldier" && Math.random() < ZTYPES.soldier.drop) {
    const wid = pick(["mx5", "r4", "k74", "sg12", "dmr", "mx5"]);
    const d = wdef({ id: wid });
    dropWeapon(G, z.x, z.y, { id: wid, up: false, mag: d.mag, res: Math.round(d.res * 0.4) }, 30);
  }
  // power-up drop
  const D = Z.drops;
  if (how !== "nuke" && killer && D.n < DROP.maxPerRound && G.time - D.last > DROP.gap && Math.random() < DROP.chance) ZM.spawnPowerup(G, z.x, z.y);
};

/* ---------------- power-ups ---------------- */
ZM.spawnPowerup = function (G, x, y, type) {
  const Z = G.z;
  if (!type) {
    const pool = Object.entries(POWERUPS).filter(([k]) => !(k === "barrier" && !G.map.windows.some((w) => w.boards < WINDOW_BOARDS)));
    let tot = pool.reduce((t, [, p]) => t + p.w, 0), r = Math.random() * tot;
    for (const [k, p] of pool) { r -= p.w; if (r <= 0) { type = k; break; } }
    type = type || "ammo";
  }
  const p = { id: G.nextId++, type, x, y, t: 26 };
  G.powerups.push(p);
  Z.drops.n++; Z.drops.last = G.time;
  ev(G, { k: "pu_spawn", x, y, t: type });
};

ZM.takePowerup = function (G, p, who) {
  const Z = G.z, ps = ZM.players(G);
  ev(G, { k: "pu_take", t: p.type, x: p.x, y: p.y });
  switch (p.type) {
    case "ammo":
      for (const a of ps) if (a.alive) { for (const s of a.weapons) { const d = wdef(s); s.res = d.res; if (G.cfg.fullMagAmmo) s.mag = d.mag; } a.frags = Math.max(a.frags, 2); }
      break;
    case "double": Z.timers.double = POWERUPS.double.t; break;
    case "insta": Z.timers.insta = POWERUPS.insta.t; break;
    case "sale": Z.timers.sale = POWERUPS.sale.t; break;
    case "nuke": {
      const zs = G.actors.filter((a) => a.kind === "zombie" && a.alive && a.rise <= 0.6);
      for (const z of zs) { z.stun = 2; }
      setTimeoutSim(G, 0.3, () => { for (const z of zs) if (z.alive) ZM.damageZombie(G, z, z.hp + 1, who, "nuke", false, "nuke"); });
      for (const a of ps) if (a.alive) a.points += POINTS.nuke * (Z.timers.double > 0 ? 2 : 1);
      break;
    }
    case "barrier":
      for (const w of G.map.windows) { w.boards = WINDOW_BOARDS; refreshTile(G.map, w.i); ev(G, { k: "board", w: G.map.windows.indexOf(w), n: w.boards, x: w.wx, y: w.wy, quiet: true }); }
      for (const a of ps) if (a.alive) a.points += 200;
      break;
  }
};
// small timed actions inside the simulation
function setTimeoutSim(G, t, fn) { (G.timers || (G.timers = [])).push({ t: G.time + t, fn }); }
function runSimTimers(G) { if (!G.timers || !G.timers.length) return; const due = G.timers.filter((x) => x.t <= G.time); G.timers = G.timers.filter((x) => x.t > G.time); due.forEach((x) => x.fn()); }

/* ---------------- mystery box ---------------- */
ZM.rollBox = function (G, user) {
  const have = user ? user.weapons.map((w) => w.id) : [];
  const pool = WEAPON_IDS.filter((id) => WEAPONS[id].box > 0 && !have.includes(id));
  let tot = pool.reduce((t, id) => t + WEAPONS[id].box, 0), r = Math.random() * tot;
  for (const id of pool) { r -= WEAPONS[id].box; if (r <= 0) return id; }
  return pool[0] || "mx5";
};
ZM.giveWeapon = function (G, a, id, up = false) {
  const slot = newSlot(id, up);
  if (a.weapons.length < 2) { a.weapons.push(slot); a.cur = a.weapons.length - 1; }
  else a.weapons[a.cur] = slot;
  a.reloadT = 0; a.swapT = 0.4;
  ev(G, { k: "snd", s: "pickup", x: a.x, y: a.y, v: 1, o: a.id });
};

/* ---------------- downed / revive ---------------- */
ZM.playerDown = function (G, a) {
  const Z = G.z;
  if (a.down) return;
  a.downs++;
  const solo = ZM.soloLike(G);
  const hadWind = hasPerk(a, "wind");
  a.perks = []; a.maxHp = 150;
  if (solo && hadWind && a.windUses < 3) {
    a.down = true; a.selfRev = 3.2; a.windUses++; a.hp = 1;
    ev(G, { k: "down", id: a.id, self: true });
    return;
  }
  if (solo) { a.alive = false; a.hp = 0; ev(G, { k: "dead", id: a.id }); return; }
  a.down = true; a.bleed = 30; a.hp = 1; a.selfRev = 0;
  // last stand: you keep a pistol
  const pi = a.weapons.findIndex((w) => ["pistol", "magnum"].includes(WEAPONS[w.id].cls));
  if (pi >= 0) a.cur = pi;
  else { a.tempPistol = true; a.weapons.push(newSlot("p9")); a.cur = a.weapons.length - 1; }
  a.reloadT = 0;
  ev(G, { k: "down", id: a.id });
};
ZM.downTick = function (G, a, inp, dt) {
  if (a.selfRev > 0) { a.selfRev -= dt; if (a.selfRev <= 0) ZM.revive(G, a, a); return; }
  a.bleed -= dt * (a.reviver ? 0 : 1);
  a.reviver = null;
  if (a.bleed <= 0) { a.alive = false; a.down = false; ev(G, { k: "dead", id: a.id }); }
};
ZM.revive = function (G, a, by) {
  a.down = false; a.selfRev = 0; a.bleed = 0; a.hp = a.maxHp * (by && by !== a ? 0.6 : 1); a.protectT = 1.5; a.hurtT = G.time;
  if (a.tempPistol) { a.weapons.pop(); a.tempPistol = false; a.cur = 0; }
  if (by && by !== a) { by.revives++; by.points += POINTS.revive; }
  ev(G, { k: "revived", id: a.id });
};

/* ---------------- USE prompts ---------------- */
ZM.prompt = function (G, a) {
  const m = G.map, Z = G.z, mult = 1;
  const near = (x, y, r) => dist2(a.x, a.y, x, y) < r * r;
  // revive a downed teammate
  if (!Z.versus) for (const b of ZM.players(G)) {
    if (b === a || !b.down || !b.alive || b.selfRev > 0) continue;
    if (near(b.x, b.y, 64)) {
      const t = hasPerk(a, "wind") ? 1.5 : 3;
      return { key: "rev" + b.id, label: "HOLD TO REVIVE " + b.name.toUpperCase(), hold: t, can: true, tick: () => { b.reviver = a; }, act: () => ZM.revive(G, b, a) };
    }
  }
  // mystery box weapon waiting for you
  const B = Z.box, bs = m.boxSpots[B.spot];
  if (bs && B.state === "offer" && B.user === a && near(bs.wx, bs.wy, 70)) return { key: "boxtake", label: "TAKE " + WEAPONS[B.wid].name.toUpperCase(), can: true, act: () => { ZM.giveWeapon(G, a, B.wid); B.state = "idle"; B.wid = null; B.user = null; } };
  // weapon on the ground
  for (const d of G.drops) if (near(d.x, d.y, 40) && !a.weapons.some((w) => w.id === d.wid)) return { key: "drop" + d.id, label: "SWAP FOR " + wdef({ id: d.wid, up: d.up }).name.toUpperCase(), can: true, act: () => takeDrop(G, a, d) };
  // repair a window
  for (const w of m.windows) {
    if (w.boards >= WINDOW_BOARDS || !near(w.wx, w.wy, 66)) continue;
    const myArea = m.area[tileOf(m, a.x, a.y)];
    if (myArea >= 0 && !Z.open.has(myArea)) continue;
    const zClose = G.actors.some((z) => z.kind === "zombie" && z.alive && z.atkT > 0 && dist2(z.x, z.y, w.wx, w.wy) < 36 * 36);
    return { key: "win" + w.i, label: "HOLD TO REBUILD BARRIER", hold: 0.55, can: !zClose, why: "ZOMBIE IN THE WAY", act: () => {
      w.boards++; refreshTile(m, w.i);
      const got = Z.boardPts[a.id] || 0;
      if (got < POINTS.boardMax) { const g = POINTS.board * (Z.timers.double > 0 ? 2 : 1); a.points += g; Z.boardPts[a.id] = got + g; ev(G, { k: "pts", pid: a.id, n: g, x: w.wx, y: w.wy }); }
      ev(G, { k: "board", w: m.winAt[w.i], n: w.boards, x: w.wx, y: w.wy, fix: true });
    } };
  }
  // wall guns
  for (const wb of m.wallbuys) {
    if (!near(wb.wx, wb.wy, 58)) continue;
    const d = WEAPONS[wb.gun], has = a.weapons.find((w) => w.id === wb.gun);
    if (has) {
      const cost = has.up ? 2500 : Math.round(d.cost / 2);
      const full = has.res >= wdef(has).res && has.mag >= wdef(has).mag;
      return { key: "wb" + wb.x + "," + wb.y, label: full ? "AMMO FULL" : "BUY AMMO", cost, can: !full && a.points >= cost, why: full ? "AMMO FULL" : "NOT ENOUGH POINTS", act: () => { a.points -= cost; const dd = wdef(has); has.res = dd.res; has.mag = dd.mag; ev(G, { k: "snd", s: "buy", x: a.x, y: a.y, v: 1, o: a.id }); } };
    }
    return { key: "wb" + wb.x + "," + wb.y, label: "BUY " + d.name.toUpperCase(), cost: d.cost, can: a.points >= d.cost, act: () => { a.points -= d.cost; ZM.giveWeapon(G, a, wb.gun); ev(G, { k: "snd", s: "buy", x: a.x, y: a.y, v: 1, o: a.id }); } };
  }
  // doors / debris
  for (const d of m.doors) {
    if (d.open) continue;
    let close = false;
    for (const [cx, cy] of d.cells) if (near((cx + 0.5) * TILE, (cy + 0.5) * TILE, 62)) { close = true; break; }
    if (!close) continue;
    const word = d.style === "debris" ? "CLEAR DEBRIS" : d.style === "gate" ? "OPEN GATE" : "OPEN DOOR";
    return { key: "door" + d.id, label: word, cost: d.cost, can: a.points >= d.cost, act: () => { a.points -= d.cost; ZM.openDoor(G, d); } };
  }
  // perk machines
  for (const p of m.perks) {
    if (!near(p.wx, p.wy, 62)) continue;
    const P = PERKS[p.perk];
    if (p.gone) continue;
    if (hasPerk(a, p.perk)) return { key: "perk" + p.perk, label: P.name + " · OWNED", can: false, why: "YOU ALREADY HAVE IT", act: () => {} };
    if (P.power && !Z.power) return { key: "perk" + p.perk, label: P.name + " · NEEDS POWER", can: false, why: "TURN ON THE POWER FIRST", act: () => {} };
    const solo = ZM.soloLike(G), cost = p.perk === "wind" && solo ? P.soloCost : P.cost;
    if (a.perks.length >= MAX_PERKS) return { key: "perk" + p.perk, label: P.name, cost, can: false, why: "MAX " + MAX_PERKS + " PERKS", act: () => {} };
    return { key: "perk" + p.perk, label: "DRINK " + P.name, sub: P.desc, cost, can: a.points >= cost, act: () => {
      a.points -= cost; a.perks.push(p.perk);
      if (p.perk === "iron") { a.maxHp = 250; a.hp = 250; }
      if (p.perk === "wind" && solo && a.windUses >= 2) { p.gone = true; ev(G, { k: "toast", pid: a.id, t: "LAST SECOND WIND" }); }
      ev(G, { k: "perk", pid: a.id, p: p.perk, x: p.wx, y: p.wy });
    } };
  }
  // mystery box
  if (bs && near(bs.wx, bs.wy, 70)) {
    if (B.state === "idle") { const cost = Z.timers.sale > 0 ? FIRESALE_BOX : BOX_COST; return { key: "box", label: "MYSTERY BOX", cost, can: a.points >= cost, act: () => { a.points -= cost; B.state = "spin"; B.t = 3.6; B.user = a; B.uses++; ev(G, { k: "boxspin", spot: B.spot, x: bs.wx, y: bs.wy }); } }; }
    if (B.state === "spin") return { key: "boxw", label: "SPINNING…", can: false, why: "WAIT FOR IT", act: () => {} };
  }
  // forge (needs power)
  const F = m.forge;
  if (F && near(F.wx, F.wy, 66)) {
    const slot = curSlot(a), d = WEAPONS[slot.id];
    if (!Z.power) return { key: "forge", label: "FORGE · NEEDS POWER", can: false, why: "TURN ON THE POWER FIRST", act: () => {} };
    if (slot.up || !d.up) return { key: "forge", label: "FORGE · " + (slot.up ? "ALREADY UPGRADED" : "CAN'T UPGRADE THIS"), can: false, why: "TRY ANOTHER GUN", act: () => {} };
    return { key: "forge", label: "HOLD TO FORGE " + d.name.toUpperCase(), sub: "→ " + d.up.name, cost: FORGE_COST, hold: 2.2, can: a.points >= FORGE_COST, tick: () => { if (Math.random() < 0.2) ev(G, { k: "spark", x: F.wx, y: F.wy }); },
      act: () => { a.points -= FORGE_COST; slot.up = true; const dd = wdef(slot); slot.mag = dd.mag; slot.res = dd.res; ev(G, { k: "forged", pid: a.id, x: F.wx, y: F.wy, w: dd.name }); } };
  }
  // power switch
  const S = m.power;
  if (S && !Z.power && near(S.wx, S.wy, 62)) return { key: "power", label: "HOLD TO TURN ON THE POWER", hold: 1.2, can: true, act: () => { Z.power = true; ev(G, { k: "power" }); } };
  return null;
};

ZM.openDoor = function (G, d) {
  const m = G.map, Z = G.z;
  d.open = true;
  for (const i of d.tiles) refreshTile(m, i);
  for (const a of d.sides) Z.open.add(a);
  Z.fieldT = 0;
  ev(G, { k: "door", id: d.id, x: d.cx, y: d.cy, style: d.style });
};

// ===== tdm.js =====
/* TEAM DEATHMATCH: two teams of four (bots fill empty spots), respawns, weapon drops, killstreaks. */

const TD = {};

TD.init = function (G) {
  const cfg = G.cfg, m = G.map;
  G.t = { score: [0, 0], timeLeft: cfg.time || TDM.time, limit: cfg.limit || TDM.scoreLimit, recon: [0, 0], over: false };
  const names = BOT_NAMES.slice().sort(() => Math.random() - 0.5);
  const teams = [[], []];
  for (const p of cfg.players || []) teams[p.team || 0].push(p);
  const diff = DIFF[cfg.diff] || DIFF.regular;
  for (let t = 0; t < 2; t++) {
    const humans = teams[t];
    const size = cfg.teamSize || TDM.size;
    for (let k = 0; k < size; k++) {
      const p = humans[k];
      const spot = m.spawns[t][k % m.spawns[t].length];
      const o = p
        ? { human: !p.bot, pidx: p.pidx, remote: p.remote, netId: p.netId, op: p.op, name: p.name, loadout: p.loadout }
        : { human: false, op: pick(OPERATORS).id, name: names.pop() || "Bot", loadout: TD.botLoadout() };
      const a = makeSoldier(G, Object.assign(o, { team: t, x: spot.wx + rnd(-8, 8), y: spot.wy + rnd(-8, 8), ang: t === 0 ? 0 : Math.PI, hp: TDM.hp,
        weapons: TD.loadoutSlots(o.loadout), frags: 2, bot: p && !p.bot ? null : { diff, t: rnd(0.3), aimErr: rnd(-1, 1), path: null, goal: null } }));
      a.loadout = o.loadout;
      a.protectT = TDM.protect;
    }
  }
};

TD.botLoadout = () => ({ p: pick(["mx5", "mx5", "r4", "r4", "k74", "k74", "sg12", "dmr", "hammer", "longbow", "sweeper"]), s: Math.random() < 0.8 ? "p9" : "magnum" });
TD.loadoutSlots = (lo) => { lo = lo || { p: "mx5", s: "p9" }; return [newSlot(lo.p), newSlot(lo.s || "p9")]; };

TD.step = function (G, dt) {
  const T = G.t;
  if (G.over) return;
  T.timeLeft -= dt;
  for (let k = 0; k < 2; k++) if (T.recon[k] > 0) T.recon[k] -= dt;
  if (T.timeLeft <= 0 || T.score[0] >= T.limit || T.score[1] >= T.limit) {
    G.over = true; T.timeLeft = Math.max(0, T.timeLeft);
    G.winner = T.score[0] === T.score[1] ? -1 : T.score[0] > T.score[1] ? 0 : 1;
    ev(G, { k: "gameover", winner: G.winner });
  }
  runSimTimers(G);
};

TD.kill = function (G, v, src, how, wid, crit) {
  const T = G.t;
  v.alive = false; v.deaths++; v.respawnT = TDM.respawn; v.streak = 0; v.reloadT = 0;
  const pri = v.weapons[0];
  if (pri) dropWeapon(G, v.x, v.y, pri);
  let killer = src && src.kind === "soldier" ? src : null;
  if (killer && killer.team !== v.team) {
    killer.kills++; killer.streak++; killer.bestStreak = Math.max(killer.bestStreak, killer.streak);
    if (crit) killer.crits++;
    T.score[killer.team]++;
    for (const s of STREAKS) if (killer.streak === s.kills) TD.award(G, killer, s);
  } else if (killer === v) {
    T.score[v.team] = Math.max(0, T.score[v.team] - 1);
  }
  ev(G, { k: "die", id: v.id, x: v.x, y: v.y, a: src ? angTo(src.x, src.y, v.x, v.y) : v.ang, soldier: true, op: v.op, team: v.team, gib: how === "boom" });
  ev(G, { k: "feed", a: killer ? killer.name : "", at: killer ? killer.team : -1, v: v.name, vt: v.team, w: how === "knife" ? "KNIFE" : how === "boom" ? (wid === "air" ? "AIRSTRIKE" : wid === "frag" ? "FRAG" : "EXPLOSION") : WEAPONS[wid] ? WEAPONS[wid].name : "", crit, ak: killer && killer.human ? killer.id : 0, vk: v.human ? v.id : 0 });
};

TD.award = function (G, a, s) {
  ev(G, { k: "streak", pid: a.id, team: a.team, name: s.name, by: a.name });
  if (s.id === "recon") G.t.recon[a.team] = s.t;
  if (s.id === "air") {
    // aim at the biggest group of enemies
    const en = G.actors.filter((b) => b.kind === "soldier" && b.alive && b.team !== a.team);
    if (!en.length) return;
    let best = en[0], bn = -1;
    for (const e of en) { const n = en.filter((o) => dist(o.x, o.y, e.x, e.y) < 240).length; if (n > bn) { bn = n; best = e; } }
    const cx = best.x, cy = best.y, ang = rnd(TAU);
    ev(G, { k: "airwarn", x: cx, y: cy, team: a.team });
    for (let k = 0; k < 6; k++) {
      const off = (k - 2.5) * 70;
      G.projs.push({ kind: "shell", x: cx + Math.cos(ang) * off + rnd(-30, 30), y: cy + Math.sin(ang) * off + rnd(-30, 30), t: 1.8 + k * 0.2, r: 150, dmg: 170, zdmg: 0, owner: a, wid: "air" });
    }
  }
};

TD.deadTick = function (G, a, dt) {
  if (G.over) return;
  a.respawnT -= dt;
  if (a.respawnT <= 0) TD.respawn(G, a);
};

TD.respawn = function (G, a) {
  const m = G.map, spots = m.spawns[a.team];
  const en = G.actors.filter((b) => b.kind === "soldier" && b.alive && b.team !== a.team);
  let best = spots[0], bs = -1;
  for (const s of spots) {
    let dmin = 1e9; for (const e of en) dmin = Math.min(dmin, dist(s.wx, s.wy, e.x, e.y));
    const sc = dmin + rnd(0, 120);
    if (sc > bs) { bs = sc; best = s; }
  }
  a.x = best.wx + rnd(-6, 6); a.y = best.wy + rnd(-6, 6); a.vx = a.vy = 0;
  a.alive = true; a.hp = a.maxHp; a.protectT = TDM.protect; a.frags = 2; a.reloadT = 0; a.spreadAdd = 0;
  if (a.bot && !a.human) a.loadout = TD.botLoadout();
  a.weapons = TD.loadoutSlots(a.loadout); a.cur = 0;
  a.ang = a.team === 0 ? 0 : Math.PI;
  a.tp = (a.tp || 0) + 1;
  if (a.bot) { a.bot.path = null; a.bot.goal = null; a.bot.target = null; }
  ev(G, { k: "spawn", id: a.id });
};

/* two players on one screen: never let them get further apart than the camera can show */
TD.leash = function (G, a) {
  if (!a.human) return;
  const o = G.humans.find((h) => h !== a && h.alive && !h.remote);
  if (!o || !a.alive) return;
  const L = G.leashLen || 700, d = dist(a.x, a.y, o.x, o.y);
  if (d > L) { const k = (d - L) / d; a.x -= (a.x - o.x) * k; a.y -= (a.y - o.y) * k; resolveCircle(G.map, G.map.solidP, a); }
};

// ===== ai.js =====
/* Bots. Soldier bots for Team Deathmatch (see, react, aim, burst, strafe, flank, grenade), and a zombies-mode bot
   (used for the title-screen demo and for the balance simulation): kites zombies, shoots, rebuilds windows, shops. */

function botThink(G, a, dt) {
  if (a.bot.zombieBot) return zbotThink(G, a, dt);
  return sbotThink(G, a, dt);
}

/* can bot `a` see `b` (walls block; corn hides anything more than ~2.5 m inside it) */
function canSee(G, a, b, maxD = 1150) {
  const d = dist(a.x, a.y, b.x, b.y);
  if (d > maxD) return false;
  const m = G.map, ux = (b.x - a.x) / d, uy = (b.y - a.y) / d;
  let cornRun = 0;
  const r = rayGrid(m, a.x, a.y, ux, uy, d, m.sight, (i, dd) => { cornRun = cornRun || dd; return dd - cornRun > 95 && d - dd > 30; });
  return r.i === -1;
}

const _botTmp = [];
function sbotThink(G, a, dt) {
  const B = a.bot, D = B.diff, m = G.map;
  const inp = B.inp || (B.inp = {});
  inp.fire = false; inp.reload = false; inp.knife = false; inp.gren = false; inp.swap = false;
  B.t -= dt;
  B.reactT = (B.reactT || 0) - dt;
  B.burst = (B.burst || 0) - dt;
  B.strafeT = (B.strafeT || 0) - dt;
  B.goalT = (B.goalT || 0) - dt;
  const slot = curSlot(a), wd = wdef(slot);
  if (B.t <= 0) {
    B.t = 0.11 + rnd(0.04);
    // --- perception
    let tgt = null, ts = 1e9;
    for (const b of G.actors) {
      if (b.kind !== "soldier" || !b.alive || b.team === a.team) continue;
      const d = dist(a.x, a.y, b.x, b.y);
      const da = Math.abs(angDiff(a.ang, angTo(a.x, a.y, b.x, b.y)));
      const heard = G.time - b.lastShot < 1.2 && d < 750;
      const radar = G.t && G.t.recon[a.team] > 0 && d < 900;
      if (!(da < 1.9 || d < 230 || heard || radar)) continue;
      if (!canSee(G, a, b)) continue;
      const s = d + da * 140 - (b === B.target ? 160 : 0);
      if (s < ts) { ts = s; tgt = b; }
    }
    if (tgt && tgt !== B.target) { B.reactT = D.react * rnd(0.8, 1.35) * (B.target ? 0.5 : 1); B.settle = 0; }
    B.target = tgt;
    if (tgt) { B.lastSeen = [tgt.x, tgt.y, G.time]; B.path = null; }
    // heard gunfire: remember where
    if (!tgt) {
      for (const b of G.actors) if (b.kind === "soldier" && b.alive && b.team !== a.team && G.time - b.lastShot < 0.6 && dist(a.x, a.y, b.x, b.y) < 950) { B.heard = [b.x, b.y, G.time]; break; }
    }
    // weapon choice: snipers / launchers switch to the pistol up close
    if (tgt) {
      const d = dist(a.x, a.y, tgt.x, tgt.y);
      if (a.cur === 0 && ["sniper", "launcher"].includes(wd.cls) && d < 150 && a.weapons[1] && a.swapT <= 0) inp.swap = true;
      else if (a.cur === 1 && d > 320 && a.weapons[0] && (a.weapons[0].mag + a.weapons[0].res) > 0 && a.swapT <= 0) inp.swap = true;
    } else if (a.cur === 1 && a.weapons[0] && (a.weapons[0].mag + a.weapons[0].res) > 0 && a.swapT <= 0 && Math.random() < 0.3) inp.swap = true;
    // grenade at someone who just ducked behind cover
    if (!tgt && B.lastSeen && G.time - B.lastSeen[2] < 2.5 && a.frags > 0 && a.gCD <= 0 && Math.random() < 0.14 * D.burst) {
      const d = dist(a.x, a.y, B.lastSeen[0], B.lastSeen[1]);
      if (d > 170 && d < 460) { B.throwAt = [B.lastSeen[0], B.lastSeen[1]]; }
    }
    // reload while nothing is happening
    if (!tgt && slot.mag < wd.mag * 0.5 && slot.res > 0) inp.reload = true;
    // --- navigation goal when nothing to shoot
    if (!tgt && (!B.goal || B.goalT <= 0 || dist(a.x, a.y, B.goal[0], B.goal[1]) < 50)) {
      if (B.lastSeen && G.time - B.lastSeen[2] < 6) B.goal = [B.lastSeen[0], B.lastSeen[1]];
      else if (B.heard && G.time - B.heard[2] < 5) B.goal = [B.heard[0], B.heard[1]];
      else B.goal = botRoamGoal(G, a);
      B.goalT = rnd(8, 14); B.path = null;
    }
  }
  const tgt = B.target && B.target.alive ? B.target : null;
  let mx = 0, my = 0;
  // --- grenade throw (turn first)
  if (B.throwAt) {
    const ta = angTo(a.x, a.y, B.throwAt[0], B.throwAt[1]);
    inp.aim = turnTo(a.ang, ta, D.track * dt * 1.4);
    if (Math.abs(angDiff(a.ang, ta)) < 0.12) { inp.gren = true; inp.grenDist = dist(a.x, a.y, B.throwAt[0], B.throwAt[1]); B.throwAt = null; }
  }
  if (tgt) {
    const d = dist(a.x, a.y, tgt.x, tgt.y);
    // aim with lead and a wobble that settles the longer the bot tracks you
    B.settle = Math.min(1, (B.settle || 0) + dt * 0.8);
    const lead = Math.min(0.25, d / 2200);
    const ta = angTo(a.x, a.y, tgt.x + tgt.vx * lead, tgt.y + tgt.vy * lead);
    const err = D.aimErr * (1.2 - B.settle * 0.6) * (Math.sin(G.time * 2.3 + a.id) * 0.7 + Math.sin(G.time * 5.1 + a.id * 3) * 0.3) * (1 + Math.hypot(tgt.vx, tgt.vy) / 300);
    if (!B.throwAt) inp.aim = turnTo(a.ang, ta + err, D.track * dt);
    const aligned = Math.abs(angDiff(a.ang, ta)) < 0.16 + wd.spread;
    if (B.reactT <= 0 && aligned) {
      if (d < 52 && Math.random() < 0.08) inp.knife = true;
      else if (wd.auto) {
        if (B.burst <= 0 && !B.firing) { B.firing = true; B.burst = rnd(0.25, 0.65) * (d > 500 ? 0.6 : 1); }
        else if (B.burst <= 0 && B.firing) { B.firing = false; B.burst = rnd(0.12, 0.38) / D.burst; }
        inp.fire = B.firing;
      } else inp.fire = Math.random() < 0.55 + D.burst * 0.4;
    }
    // movement: strafe, keep a good range for the gun, back off when hurt
    const pref = { smg: 230, shotgun: 120, sniper: 650, dmr: 480, lmg: 380, pistol: 260, magnum: 300, launcher: 420, ak: 360, rifle: 380 }[wd.cls] || 320;
    if (B.strafeT <= 0) { B.strafe = Math.random() < 0.5 ? -1 : 1; B.strafeT = rnd(0.5, 1.4); B.still = Math.random() < 0.18; }
    const ang = angTo(a.x, a.y, tgt.x, tgt.y);
    let fwd = d > pref * 1.25 ? 0.8 : d < pref * 0.6 ? -0.7 : 0;
    if (a.hp < 35) fwd = -0.6;
    const st = B.still ? 0 : B.strafe * 0.85;
    mx = Math.cos(ang) * fwd + Math.cos(ang + Math.PI / 2) * st;
    my = Math.sin(ang) * fwd + Math.sin(ang + Math.PI / 2) * st;
    // don't strafe into walls
    const px = a.x + mx * 30, py = a.y + my * 30;
    if (isSolidAt(m, m.solidP, px, py)) { B.strafe = -B.strafe; mx = -mx * 0.5; my = -my * 0.5; }
  } else {
    // follow a path to the goal
    if (B.goal) {
      if (!B.path || B.pathI >= B.path.length) { B.path = findPath(m, a.x, a.y, B.goal[0], B.goal[1]); B.pathI = 1; if (!B.path) B.goal = null; }
      if (B.path) {
        // skip ahead to the furthest waypoint we can walk to in a straight line
        for (let k = Math.min(B.path.length - 1, B.pathI + 5); k > B.pathI; k--) {
          const [wx, wy] = tileCenter(m, B.path[k]);
          if (walkLine(m, a.x, a.y, wx, wy, a.r - 2)) { B.pathI = k; break; }
        }
        const [wx, wy] = tileCenter(m, B.path[Math.min(B.pathI, B.path.length - 1)]);
        if (dist(a.x, a.y, wx, wy) < 18) B.pathI++;
        const ang = angTo(a.x, a.y, wx, wy);
        mx = Math.cos(ang); my = Math.sin(ang);
        if (!B.throwAt) inp.aim = turnTo(a.ang, B.lastSeen && G.time - B.lastSeen[2] < 3 ? angTo(a.x, a.y, B.lastSeen[0], B.lastSeen[1]) : ang, D.track * dt * 0.7);
      }
    }
    // stuck detection
    B.stk = (B.stk || 0) + dt;
    if (B.stk > 1.2) { if (B.stkPos && dist(a.x, a.y, B.stkPos[0], B.stkPos[1]) < 14) { B.path = null; B.goal = botRoamGoal(G, a); } B.stkPos = [a.x, a.y]; B.stk = 0; }
  }
  inp.mx = mx; inp.my = my;
  return inp;
}

// pick somewhere to go: the middle lanes or the enemy's half (bots on a human's team stay a bit closer to them)
function botRoamGoal(G, a) {
  const m = G.map;
  const mate = a.team === 0 && G.humans.find((h) => h.team === a.team && h.alive);
  for (let tries = 0; tries < 30; tries++) {
    let x, y;
    if (mate && Math.random() < 0.3) { x = mate.x + rnd(-260, 260); y = mate.y + rnd(-260, 260); }
    else {
      const enemySide = a.team === 0 ? 1 : 0, sp = m.spawns[enemySide][0], mine = m.spawns[a.team][0];
      const t = Math.random() < 0.6 ? rnd(0.35, 0.95) : rnd(0.1, 0.6);
      x = lerp(mine.wx, sp.wx, t) + rnd(-m.pw * 0.3, m.pw * 0.3) * (Math.abs(sp.wx - mine.wx) > Math.abs(sp.wy - mine.wy) ? 0.15 : 1);
      y = lerp(mine.wy, sp.wy, t) + rnd(-m.ph * 0.45, m.ph * 0.45) * (Math.abs(sp.wx - mine.wx) > Math.abs(sp.wy - mine.wy) ? 1 : 0.15);
    }
    const i = tileOf(m, x, y);
    if (i >= 0 && !m.solidP[i]) { const [cx, cy] = tileCenter(m, i); return [cx, cy]; }
  }
  return [m.pw / 2, m.ph / 2];
}

/* ---------------- zombies bot (title demo + balance simulation) ---------------- */
function zbotThink(G, a, dt) {
  const B = a.bot, m = G.map, Z = G.z;
  const inp = B.inp || (B.inp = {});
  inp.fire = false; inp.reload = false; inp.knife = false; inp.gren = false; inp.swap = false; inp.use = false; inp.useHold = false;
  const skill = B.skill || 0.8;
  B.t = (B.t || 0) - dt;
  // nearest zombies
  let near = null, nd = 1e9, threat = 0, rx = 0, ry = 0, vis = null, vd = 1e9;
  for (const z of G.actors) {
    if (z.kind !== "zombie" || !z.alive || z.rise > 0.5) continue;
    const d = dist(a.x, a.y, z.x, z.y);
    if (d < nd) { nd = d; near = z; }
    if (d < 320) { const w = 1 / Math.max(30, d); rx += (a.x - z.x) / d * w; ry += (a.y - z.y) / d * w; threat++; }
    if (d < 650 && d < vd && (B.t > 0 ? z === B.vis : los(m, a.x, a.y, z.x, z.y, m.shot))) { vd = d; vis = z; }
  }
  if (B.t <= 0) B.t = 0.15;
  B.vis = vis;
  let mx = 0, my = 0;
  if (vis) {
    const ta = angTo(a.x, a.y, vis.x + vis.vx * 0.1, vis.y + vis.vy * 0.1) + (1 - skill) * 0.12 * Math.sin(G.time * 3 + a.id);
    inp.aim = turnTo(a.ang, ta, dt * 9);
    if (Math.abs(angDiff(a.ang, ta)) < 0.12) inp.fire = true;
    if (nd < 46 && (Z.round <= 2 || curSlot(a).mag === 0)) inp.knife = true;
    if (threat >= 6 && a.frags > 0 && a.gCD <= 0 && nd > 120) { inp.gren = true; inp.grenDist = Math.min(300, nd); }
  } else if (curSlot(a).mag < wdef(curSlot(a)).mag && nd > 260) inp.reload = true;
  // kite: move away from the pack, preferring open ground and circling rather than backing into a corner
  if (threat > 0 && nd < 300) {
    const want = Math.atan2(ry, rx);
    let best = want, bs = -1e9;
    for (let k = 0; k < 16; k++) {
      const ang = (k / 16) * TAU;
      const c = Math.cos(angDiff(ang, want));
      let s = c * 1.6 + (1 - Math.abs(c)) * 0.7;
      let free = 0;
      for (let st = 1; st <= 8; st++) { if (isSolidAt(m, m.solidP, a.x + Math.cos(ang) * st * 30, a.y + Math.sin(ang) * st * 30)) break; free++; }
      s += free * 0.45;
      // walls around where this direction leads
      const px = a.x + Math.cos(ang) * 90, py = a.y + Math.sin(ang) * 90;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (isSolidAt(m, m.solidP, px + dx * 40, py + dy * 40)) s -= 0.35;
      // don't run into another zombie
      for (const z of G.actors) if (z.kind === "zombie" && z.alive && z.rise <= 0.5) { const dz = dist(a.x + Math.cos(ang) * 70, a.y + Math.sin(ang) * 70, z.x, z.y); if (dz < 70) s -= (70 - dz) / 15; }
      // stay roughly where the action is
      if (B.home) s -= dist(px, py, B.home[0], B.home[1]) / 500;
      if (s > bs) { bs = s; best = ang; }
    }
    mx = Math.cos(best); my = Math.sin(best);
  } else if (!B.noShop && (!vis || nd > 420)) {
    // calm moment: rebuild windows, shop, explore (still shooting anything in sight)
    const keepAim = inp.aim, keepFire = inp.fire;
    zbotChores(G, a, inp);
    if (vis) { inp.aim = keepAim; inp.fire = keepFire; }
    mx = inp.mx || 0; my = inp.my || 0;
  } else if (vis) {
    // hold ground and shoot, side-stepping a little
    const side = angTo(a.x, a.y, vis.x, vis.y) + Math.PI / 2 * (Math.sin(G.time * 0.7 + a.id) > 0 ? 1 : -1);
    if (!isSolidAt(m, m.solidP, a.x + Math.cos(side) * 30, a.y + Math.sin(side) * 30)) { mx = Math.cos(side) * 0.4; my = Math.sin(side) * 0.4; }
  }
  if (!B.home) { const st = G.map.start || { wx: a.x, wy: a.y }; B.home = [st.wx, st.wy]; }
  inp.mx = mx; inp.my = my;
  return inp;
}

function zbotChores(G, a, inp) {
  const B = a.bot, m = G.map, Z = G.z;
  inp.mx = 0; inp.my = 0;
  // current errand
  if (!B.errand || G.time > B.errandT) {
    B.errand = zbotPickErrand(G, a); B.errandT = G.time + 14; B.path = null;
  }
  const e = B.errand;
  if (!e) return;
  const d = dist(a.x, a.y, e.x, e.y);
  if (d < (e.r || 44)) {
    inp.aim = angTo(a.x, a.y, e.x, e.y);
    if (a.prompt && a.prompt.hold) inp.useHold = true;
    else if (a.prompt && a.prompt.can) { inp.use = true; B.errand = null; }
    else if (!a.prompt || !a.prompt.can) { if ((B.errWait = (B.errWait || 0) + 1) > 30) { B.errand = null; B.errWait = 0; } }
    if (a.prompt && a.prompt.hold && a.holdT === 0 && B.lastHold) B.errand = null;
    B.lastHold = a.prompt && a.prompt.hold;
    return;
  }
  if (!B.path || B.pathI >= B.path.length || B.pathFor !== e) { B.path = findPath(m, a.x, a.y, e.x, e.y); B.pathI = 1; B.pathFor = e; if (!B.path) { B.errand = null; return; } }
  for (let k = Math.min(B.path.length - 1, B.pathI + 4); k > B.pathI; k--) { const [wx, wy] = tileCenter(m, B.path[k]); if (walkLine(m, a.x, a.y, wx, wy, a.r - 2)) { B.pathI = k; break; } }
  const [wx, wy] = tileCenter(m, B.path[Math.min(B.pathI, B.path.length - 1)]);
  if (dist(a.x, a.y, wx, wy) < 16) B.pathI++;
  const ang = angTo(a.x, a.y, wx, wy);
  inp.mx = Math.cos(ang); inp.my = Math.sin(ang);
  inp.aim = ang;
}

// what should the zombies bot do next? (repair, buy a better gun, perks, power, doors)
function zbotPickErrand(G, a) {
  const m = G.map, Z = G.z, pts = a.points;
  const reach = (x, y) => { const s = nearestOpen(m, x, y); return Z.open.has(m.area[s]) || m.area[s] < 0; };
  const spot = (x, y) => { const t = nearestOpen(m, x, y); const [cx, cy] = tileCenter(m, t); return { x: cx, y: cy }; };
  // windows near home
  const dmg = m.windows.filter((w) => w.boards < WINDOW_BOARDS && w.sides.some((s) => Z.open.has(s)) && dist(a.x, a.y, w.wx, w.wy) < 520);
  const tier = { p9: 0, dmr: 1, sg12: 1, mx5: 2, r4: 3, k74: 3, hammer: 4 };
  const have = Math.max(...a.weapons.map((w) => (w.up ? 6 : tier[w.id] !== undefined ? tier[w.id] : 4)));
  const opts = [];
  if (Z.alive === 0 || Z.phase !== "live") for (const w of dmg) opts.push([3, Object.assign(spot(w.wx, w.wy), { r: 50 })]);
  for (const wb of m.wallbuys) if (Z.open.has(wb.area) && (tier[wb.gun] || 0) > have && pts >= WEAPONS[wb.gun].cost + 200) opts.push([6 + tier[wb.gun], { x: wb.wx, y: wb.wy, r: 40 }]);
  for (const p of m.perks) if ((Z.power || !PERKS[p.perk].power) && !p.gone && !hasPerk(a, p.perk) && a.perks.length < 4 && reach(p.wx, p.wy) && pts >= (p.perk === "wind" ? PERKS.wind.soloCost : PERKS[p.perk].cost) + 100) opts.push([p.perk === "iron" ? 12 : p.perk === "wind" ? 10 : 5, Object.assign(spot(p.wx, p.wy), { r: 52 })]);
  if (!Z.power && m.power && reach(m.power.wx, m.power.wy)) opts.push([11, Object.assign(spot(m.power.wx, m.power.wy), { r: 52 })]);
  if (Z.power && m.forge && reach(m.forge.wx, m.forge.wy) && pts >= FORGE_COST + 500 && !curSlot(a).up && WEAPONS[curSlot(a).id].up) opts.push([10, Object.assign(spot(m.forge.wx, m.forge.wy), { r: 52 })]);
  for (const d of m.doors) {
    if (d.open || !d.sides.some((s) => Z.open.has(s)) || pts < d.cost + 300) continue;
    // stand on the open side of the door
    let best = null;
    for (const [cx, cy] of d.cells) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const i = (cy + dy) * m.W + cx + dx; if (m.solidP[i] || !Z.open.has(m.area[i])) continue;
      const [wx, wy] = tileCenter(m, i); if (!best || dist(a.x, a.y, wx, wy) < dist(a.x, a.y, best.x, best.y)) best = { x: wx, y: wy, r: 30 };
    }
    // a door that leads to a better gun, the power or a perk is worth more
    const other = d.sides.find((s) => !Z.open.has(s));
    let val = 4 + (G.cfg.demo ? 3 : 0);
    if (m.power && m.power.area === other && !Z.power) val += 5;
    if (m.wallbuys.some((wb) => wb.area === other && (tier[wb.gun] || 0) > have)) val += 3;
    if (best) opts.push([val, best]);
  }
  if (!opts.length) return null;
  opts.sort((p, q) => q[0] - p[0]);
  return opts[0][1];
}

// ===== render.js =====
/* Renderer: camera, baked ground, 2.5D walls and props, actors, particles, darkness with flashlight shadows,
   glow pass, weather, HUD. Draws one view (solo / shared screen) or two views (split screen). */

const R = { parts: [], corpses: [], tracers: [], flashes: [], booms: [], arcs: [], pops: [], toasts: [], feed: [], announce: null, lightning: 0, shakes: [0, 0] };

function initRender(G) {
  const m = G.map;
  R.G = G;
  R.parts = []; R.corpses = []; R.tracers = []; R.flashes = []; R.booms = []; R.arcs = []; R.pops = []; R.toasts = []; R.feed = []; R.announce = null; R.lightning = 0; R.hit = [0, 0]; R.kill = [0, 0];
  R.dmgDir = [[], []]; R.hurtFlash = [0, 0]; R.cams = [null, null]; R.boxSpin = 0; R.powerT = 0; R.rainT = 0;
  ZSHIRT = ZCLOTH[m.id] || ZCLOTH.outpost;
  R.ground = bakeGround(m);
  R.gctx = R.ground.getContext("2d");
  // wall look per tile: buildings get a style from their room, the outer walls their own
  R.wallStyle = new Array(m.N);
  for (let y = 0; y < m.H; y++) for (let x = 0; x < m.W; x++) {
    const i = y * m.W + x; if (m.tile[i] !== T_WALL && m.tile[i] !== T_DOOR && m.tile[i] !== T_WINDOW) continue;
    let st = m.theme.perim;
    for (let r = 1; r <= 2 && st === m.theme.perim; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= m.W || yy >= m.H) continue;
      const j = yy * m.W + xx; if (m.floor[j] === F_IN && m.tile[j] === T_FLOOR) { st = m.theme.walls[(m.area[j] * 5 + 1) % m.theme.walls.length]; }
    }
    R.wallStyle[i] = st;
  }
  R.patterns = {};
  R.lightC = makeCanvas(16, 16); R.lightG = R.lightC.getContext("2d");
  R.fogC = makeFog();
  R.cornSpr = [0, 1, 2].map((k) => cornSprite(k));
  // vehicles
  R.veh = m.vehicles.map((v) => Object.assign({ v }, vehicleSprite(v, m.theme, m.id)));
  R.vehAt = new Int16Array(m.N).fill(-1);
  m.vehicles.forEach((v, k) => { for (const [x, y] of v.tiles) R.vehAt[y * m.W + x] = k; });
  R.lowAt = new Int16Array(m.N).fill(-1);
  m.lows.forEach((v, k) => { if (v.tiles) for (const [x, y] of v.tiles) R.lowAt[y * m.W + x] = k; });
}

function wallPattern(style, col) {
  const key = style + col;
  if (R.patterns[key]) return R.patterns[key];
  const c = makeCanvas(40, 20), g = c.getContext("2d");
  g.fillStyle = col; g.fillRect(0, 0, 40, 20);
  g.strokeStyle = "rgba(0,0,0,.28)"; g.lineWidth = 1;
  if (style === "brick") { for (let y = 0; y < 20; y += 5) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(40, y + 0.5); g.stroke(); for (let x = (y / 5) % 2 ? 5 : 0; x < 40; x += 10) { g.beginPath(); g.moveTo(x + 0.5, y); g.lineTo(x + 0.5, y + 5); g.stroke(); } } }
  else if (style === "wood") { for (let y = 0; y < 20; y += 4) { g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(0, y + 3, 40, 1); g.fillStyle = "rgba(255,255,255,.06)"; g.fillRect(0, y, 40, 1); } }
  else if (style === "metal") { for (let x = 0; x < 40; x += 5) { g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(x, 0, 2, 20); g.fillStyle = "rgba(0,0,0,.2)"; g.fillRect(x + 2, 0, 1, 20); } }
  else if (style === "stone") { for (let k = 0; k < 6; k++) { g.strokeRect((k * 13) % 40, (k * 7) % 20, 12, 7); } }
  else if (style === "stucco") { for (let k = 0; k < 60; k++) { g.fillStyle = rgba(Math.random() < 0.5 ? "#000" : "#fff", 0.06); g.fillRect(Math.random() * 40, Math.random() * 20, 1.5, 1.5); } }
  else { for (let y = 0; y < 20; y += 10) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(40, y + 0.5); g.stroke(); for (let x = (y / 10) % 2 ? 10 : 0; x < 40; x += 20) { g.beginPath(); g.moveTo(x + 0.5, y); g.lineTo(x + 0.5, y + 10); g.stroke(); } } }
  const p = R.lightG.createPattern(c, "repeat");
  R.patterns[key] = p;
  return p;
}

// wall tops: a cap texture (concrete block / bricks / planks / sheet metal) seen from above
function wallCapPattern(st) {
  const key = "cap" + st[0] + st[1];
  if (R.patterns[key]) return R.patterns[key];
  const c = makeCanvas(40, 40), g = c.getContext("2d");
  const k = st[0];
  g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 1;
  if (k === "brick") { for (let y = 0; y < 40; y += 8) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(40, y + 0.5); g.stroke(); for (let x = (y / 8) % 2 ? 10 : 0; x < 40; x += 20) { g.beginPath(); g.moveTo(x + 0.5, y); g.lineTo(x + 0.5, y + 8); g.stroke(); } } }
  else if (k === "wood") { for (let x = 0; x < 40; x += 8) { g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(x + 7, 0, 1, 40); g.fillStyle = "rgba(255,255,255,.05)"; g.fillRect(x, 0, 1, 40); } }
  else if (k === "metal") { for (let x = 0; x < 40; x += 6) { g.fillStyle = "rgba(255,255,255,.06)"; g.fillRect(x, 0, 2, 40); g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(x + 3, 0, 1, 40); } }
  else { g.strokeRect(0.5, 0.5, 40, 20); g.strokeRect(20.5, 20.5, 40, 20); g.strokeRect(-19.5, 20.5, 40, 20); }
  for (let n = 0; n < 50; n++) { g.fillStyle = rgba(Math.random() < 0.5 ? "#000" : "#fff", 0.05); g.fillRect(Math.random() * 40, Math.random() * 40, 2, 2); }
  const p = R.lightG.createPattern(c, "repeat");
  R.patterns[key] = p; return p;
}

function makeFog() {
